name: fruit_business_monitor
title: "Fruit Business Monitor"
description: |
  End-to-end dashboard for monitoring the fruit business — sales KPIs,
  revenue trends, top products, customer rankings, and returns analysis.

tasks:
  # ── KPIs — orders ─────────────────────────────────────────────────────
  - name: kpis_orders
    type: semantic_query
    topic: fruit_business
    measures:
      - orders.total_orders
      - orders.total_order_value
      - orders.avg_order_value
      - orders.distinct_customers_with_orders
      - orders.total_shipping_costs
    filters:
      - field: orders.order_date
        op: gte
        value: "2024-01-01"
      - field: orders.order_date
        op: lte
        value: "2025-12-31"

  # ── KPIs — returns ────────────────────────────────────────────────────
  - name: kpis_returns
    type: semantic_query
    topic: fruit_business
    measures:
      - order_returns.total_returns
      - order_returns.total_refund_amount

  # ── Revenue trend by month ─────────────────────────────────────────────
  - name: revenue_by_month
    type: semantic_query
    topic: fruit_business
    measures:
      - orders.total_orders
      - orders.total_order_value
    time_dimensions:
      - dimension: orders.order_date
        granularity: month
    filters:
      - field: orders.order_date
        op: gte
        value: "2024-01-01"
      - field: orders.order_date
        op: lte
        value: "2025-12-31"
    orders:
      - field: orders.order_date
        direction: asc

  # ── Revenue by order status ────────────────────────────────────────────
  - name: orders_by_status
    type: semantic_query
    topic: fruit_business
    dimensions:
      - orders.order_status
    measures:
      - orders.total_orders
      - orders.total_order_value
    filters:
      - field: orders.order_date
        op: gte
        value: "2024-01-01"
      - field: orders.order_date
        op: lte
        value: "2025-12-31"
    orders:
      - field: orders.total_orders
        direction: desc

  # ── Returns by reason ─────────────────────────────────────────────────
  - name: returns_by_reason
    type: semantic_query
    topic: fruit_business
    dimensions:
      - order_returns.return_reason
    measures:
      - order_returns.total_returns
      - order_returns.total_refund_amount
    orders:
      - field: order_returns.total_returns
        direction: desc
    limit: 10

  # ── Supplier scorecard ────────────────────────────────────────────────
  - name: supplier_scorecard
    type: semantic_query
    topic: fruit_business
    dimensions:
      - supplier_scorecard.supplier_name
      - supplier_scorecard.supplier_country
      - supplier_scorecard.supplier_rating
    measures:
      - supplier_scorecard.total_relationships
      - supplier_scorecard.avg_wholesale_price
      - supplier_scorecard.avg_lead_time
    orders:
      - field: supplier_scorecard.supplier_rating
        direction: desc
    limit: 10

  # ── Suppliers by country ──────────────────────────────────────────────
  - name: suppliers_by_country
    type: semantic_query
    topic: fruit_business
    dimensions:
      - fruit_suppliers.country
    measures:
      - fruit_suppliers.total_suppliers
      - fruit_suppliers.avg_supplier_rating
    orders:
      - field: fruit_suppliers.total_suppliers
        direction: desc

  # ── Shipment status breakdown ─────────────────────────────────────────
  - name: shipments_by_status
    type: semantic_query
    topic: fruit_business
    dimensions:
      - order_shipments.shipment_status
    measures:
      - order_shipments.total_shipments
      - order_shipments.delivered_shipments
      - order_shipments.on_time_shipments
    orders:
      - field: order_shipments.total_shipments
        direction: desc

display:
  # ── Header ─────────────────────────────────────────────────────────────
  - type: markdown
    content: |
      # Fruit Business Monitor
      Key metrics across sales, product performance, customers, and returns.

  # ── Filters ────────────────────────────────────────────────────────────
  - type: controls
    items:
      - name: start_date
        type: date
        label: "Start Date"
        default: "2024-01-01"
      - name: end_date
        type: date
        label: "End Date"
        default: "2025-12-31"
      - name: order_status
        type: select
        label: "Order Status"
        options:
          - "all"
          - "completed"
          - "pending"
          - "cancelled"
          - "refunded"
        default: "all"

  # ── KPI summary tables ─────────────────────────────────────────────────
  - type: table
    title: "Sales KPIs"
    data: kpis_orders

  - type: table
    title: "Returns KPIs"
    data: kpis_returns

  # ── Revenue trend ──────────────────────────────────────────────────────
  - type: line_chart
    title: "Monthly Revenue"
    data: revenue_by_month
    x: orders__order_date__month
    y: orders__total_order_value
    x_axis_label: "Month"
    y_axis_label: "Revenue ($)"

  # ── Orders by status ───────────────────────────────────────────────────
  - type: bar_chart
    title: "Orders by Status"
    data: orders_by_status
    x: orders__order_status
    y: orders__total_orders
    x_axis_label: "Status"
    y_axis_label: "Number of Orders"

  # ── Returns analysis ───────────────────────────────────────────────────
  - type: pie_chart
    title: "Returns by Reason"
    data: returns_by_reason
    name: order_returns__return_reason
    value: order_returns__total_returns

  - type: table
    title: "Returns Breakdown"
    data: returns_by_reason

  # ── Supplier performance ───────────────────────────────────────────────
  - type: markdown
    content: |
      ## Supplier Performance

  - type: bar_chart
    title: "Suppliers by Country"
    data: suppliers_by_country
    x: fruit_suppliers__country
    y: fruit_suppliers__total_suppliers
    x_axis_label: "Country"
    y_axis_label: "Number of Suppliers"

  - type: table
    title: "Supplier Scorecard"
    data: supplier_scorecard

  # ── Shipment tracking ──────────────────────────────────────────────────
  - type: markdown
    content: |
      ## Shipment Tracking

  - type: bar_chart
    title: "Shipments by Status"
    data: shipments_by_status
    x: order_shipments__shipment_status
    y: order_shipments__total_shipments
    x_axis_label: "Status"
    y_axis_label: "Number of Shipments"

  - type: table
    title: "Shipment Status Details"
    data: shipments_by_status
