# yaml-language-server: $schema=https://raw.githubusercontent.com/oxy-hq/oxygen/refs/heads/main/json-schemas/agent-test.json
#
# Test file for the analytics agentic agent.
#
# Convention: <name>.test.yml. If `target` is omitted it is inferred from the
# filename by stripping `.test.yml` (sales.agentic.test.yml -> sales.agentic.yml
# in the same directory). This file lives in testing/ while its target sits at
# the project root, so `target` is set explicitly below.
#
# `target` must be an `.agentic.yml` agent. The classic `.agent.yml` runtime was
# removed, and inline `tests:` blocks in `.agent.yml` / `.workflow.yml` are no
# longer supported — `.test.yml` is the only entry point.

target: analytics.agentic.yml

settings:
  concurrency: 5
  runs: 3                          # times to run each case (consistency = variance across runs)
  judge_model: gpt-5-mini          # model used for LLM-as-judge evaluation
                                   # recommendation: use a different model family than the agent
                                   # to avoid self-preference bias

cases:
  - prompt: "How many users signed up last month?"
    expected: "1,247 new user signups"
    tags: [users, signups, critical]

  - prompt: "What's the revenue trend for Q4?"
    expected: "Q4 revenue showed a 15% increase compared to Q3"
    tags: [revenue, trends]

  - prompt: "Who is the CEO of Apple?"
    expected: "Tim Cook"
    tags: [general-knowledge]

  - prompt: "Show me top 5 customers by lifetime value"
    expected: |
      A ranked list of 5 customers ordered by total spend/lifetime value,
      including customer names and their LTV amounts.
    tags: [customers, critical]

# Optional per-case fields:
#
#   name: <string>   A stable label for the case. Used by `--case <name>` and
#                    shown in the progress bar instead of the truncated prompt.
#   tool: <string>   Parsed and accepted, but tool-use assertion is NOT yet
#                    implemented in the eval pipeline (see the TODO on
#                    TestCase::tool in crates/core/src/config/test_config.rs).
#                    Setting it currently has no effect on pass/fail.
#
# How evaluation works:
#
# For each case, the system:
#   1. Runs the agent `runs` times (default: 3) with the given prompt
#   2. For each run, an LLM judge scores correctness (pass/fail):
#      "Is the agent's answer factually consistent with the expected answer?"
#      The judge uses CoT reasoning and ignores formatting/style differences.
#   3. Aggregates results per case:
#      - pass_rate: fraction of runs that passed correctness (e.g., 3/3 = 1.0)
#      - consistent: true if all runs produced the same verdict
#   4. Aggregates results across cases:
#      - score: overall pass rate across all cases
#      - consistency: fraction of cases that were fully consistent
#
# CLI usage:
#   oxy test                                        # run all *.test.yml in project
#   oxy test testing/analytics.agentic.test.yml     # run specific test file
#   oxy test --tag critical                         # filter by tag
#   oxy test --min-accuracy 0.8                     # fail if score < 80%
#   oxy test --output-json                          # write results to JSON file
#   oxy test testing/analytics.agentic.test.yml --case 0
#                                                   # run one case by index, name, or prompt
