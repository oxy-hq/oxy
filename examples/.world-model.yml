entities:
  - id: fruit_category
    label: Fruit Category
    description: Top-level product taxonomy grouping fruits into families (tropical, asian, berry, citrus, etc.)
    display_field: category_name
    dimensions:
      - name: category_id
        label: Category ID
      - name: category_name
        label: Name
      - name: category_description
        label: Description
    measures:
      # Induced up from fruit (and transitively from order line items) — these
      # aggregate over the category's fiber, so they vary per category instance.
      - name: total_fruits
        label: Fruits in Category
      - name: avg_fruit_price
        label: Avg Fruit Price
      - name: total_revenue
        label: Category Revenue
      - name: total_items
        label: Units Sold

  - id: fruit
    label: Fruit
    description: Individual fruit catalog entries with pricing information
    display_field: fruit_name
    dimensions:
      - name: fruit_id
        label: Fruit ID
      - name: fruit_name
        label: Name
      - name: fruit_price
        label: Unit Price
    measures:
      # avg_fruit_price over a single fruit = its own price.
      - name: avg_fruit_price
        label: Unit Price
      # Induced from order line items and supplier relationships.
      - name: total_revenue
        label: Revenue
      - name: total_items
        label: Units Sold
      - name: total_relationships
        label: Suppliers
      - name: avg_wholesale_price
        label: Avg Wholesale Price

  - id: supplier
    label: Supplier
    description: Suppliers who provide fruits to the business
    display_field: supplier_name
    dimensions:
      - name: supplier_id
        label: Supplier ID
      - name: supplier_name
        label: Name
      - name: country
        label: Country
      - name: rating
        label: Rating
      - name: contact_email
        label: Email
      - name: contact_phone
        label: Phone
    measures:
      # avg_supplier_rating over a single supplier = its own rating.
      - name: avg_supplier_rating
        label: Rating
      # Induced from this supplier's fruit relationships.
      - name: total_relationships
        label: Fruits Supplied
      - name: avg_wholesale_price
        label: Avg Wholesale Price
      - name: avg_lead_time
        label: Avg Lead Time
      - name: primary_supplier_relationships
        label: Primary Relationships

  - id: fruit_supplier_relationship
    label: Supplier Relationship
    description: Pricing and logistics terms between a fruit and a supplier
    dimensions:
      - name: relationship_id
        label: Relationship ID
      - name: wholesale_price
        label: Wholesale Price
      - name: minimum_order_quantity
        label: Min Order Qty
      - name: lead_time_days
        label: Lead Time (days)
      - name: is_primary_supplier
        label: Primary Supplier
    measures:
      # A relationship is a leaf row; these averages over one row = the row's values.
      - name: avg_wholesale_price
        label: Wholesale Price
      - name: avg_lead_time
        label: Lead Time

  - id: customer
    label: Customer
    description: Customers who place orders
    display_field: customer_name
    dimensions:
      - name: customer_id
        label: Customer ID
      - name: customer_name
        label: Name
      - name: gender
        label: Gender
    measures:
      # Own count measures (total_customers / distinct_customers) are always 1 for a
      # single customer instance, so they are intentionally NOT exposed here. Instead we
      # surface the measures induced up from this customer's orders and line items —
      # these aggregate over the customer's fiber and are what's interesting per instance.
      - name: total_orders
        label: Total Orders
      - name: total_order_value
        label: Total Revenue
      - name: net_revenue
        label: Net Revenue
      - name: total_shipping_costs
        label: Total Shipping
      - name: total_items
        label: Items Ordered
      - name: total_revenue
        label: Line-Item Revenue
      - name: average_quantity
        label: Avg Items per Line
      # Induced from shipments / returns (shipment & return parent to order_item).
      - name: total_shipments
        label: Shipments
      - name: total_shipment_cost
        label: Shipment Cost
      - name: total_returns
        label: Returns
      - name: total_refund_amount
        label: Refunded

  - id: order
    label: Order
    description: Customer orders with shipping and payment details
    dimensions:
      - name: order_id
        label: Order ID
      - name: order_date
        label: Order Date
      - name: order_status
        label: Status
      - name: total_amount
        label: Total Amount
      - name: shipping_cost
        label: Shipping Cost
      - name: tax_amount
        label: Tax Amount
    measures:
      # Own sums over a single order = that order's own values (total_orders would be 1,
      # so it is omitted). total_items / total_revenue are induced from this order's lines.
      - name: total_order_value
        label: Order Value
      - name: net_revenue
        label: Net Revenue
      - name: total_shipping_costs
        label: Shipping Cost
      - name: total_items
        label: Line Items
      - name: total_revenue
        label: Line-Item Revenue
      - name: average_quantity
        label: Avg Quantity
      # Induced from shipments / returns on this order's line items.
      - name: total_shipments
        label: Shipments
      - name: delivered_shipments
        label: Delivered
      - name: total_shipment_cost
        label: Shipment Cost
      - name: total_returns
        label: Returns
      - name: total_refund_amount
        label: Refunded

  - id: order_item
    label: Order Item
    description: Individual line items within an order
    dimensions:
      - name: order_id
        label: Order ID
      - name: line_item_id
        label: Line Item ID
      - name: quantity
        label: Quantity
      - name: unit_price
        label: Unit Price
      - name: discount_percent
        label: Discount %
    measures:
      # A line item is a leaf row; total_items would be 1, so only the per-row values show.
      - name: total_revenue
        label: Revenue
      - name: average_quantity
        label: Quantity
      # Induced from this line's shipments / returns.
      - name: total_shipments
        label: Shipments
      - name: total_shipment_cost
        label: Shipment Cost
      - name: total_returns
        label: Returns
      - name: total_refund_amount
        label: Refunded

  - id: shipment
    label: Shipment
    description: Shipment tracking for an order line item
    display_field: tracking_number
    dimensions:
      - name: tracking_number
        label: Tracking #
      - name: carrier
        label: Carrier
      - name: shipment_status
        label: Status
      - name: shipped_date
        label: Shipped
      - name: estimated_delivery
        label: Est. Delivery
      - name: actual_delivery
        label: Delivered
      - name: shipping_cost
        label: Shipping Cost
    # A shipment is a leaf row — its dimensions (status, dates, carrier, cost) carry
    # the detail, and own count measures would all be 1, so no measures are surfaced.
    measures: []

  - id: return
    label: Return
    description: Product return for an order line item
    dimensions:
      - name: return_id
        label: Return ID
      - name: return_reason
        label: Reason
      - name: return_status
        label: Status
      - name: return_quantity
        label: Quantity
      - name: refund_amount
        label: Refund Amount
      - name: return_date
        label: Return Date
    measures:
      # total_refund_amount over a single return = its own refund.
      - name: total_refund_amount
        label: Refund

  - id: region
    label: Region
    description: Geographic region the business operates in — the top of the store location hierarchy. Store footprint, rent, and staffing promote up into their region.
    display_field: region
    dimensions:
      - name: region
        label: Region
    measures:
      # Own count (total_regions) is 1 per region instance, so it is omitted.
      # These are the store measures induced up the region → city → store chain.
      - name: total_stores
        label: Stores
      - name: total_square_feet
        label: Floor Area
      - name: total_monthly_rent
        label: Monthly Rent
      - name: total_staff
        label: Staff
      - name: avg_square_feet
        label: Avg Floor Area
      - name: avg_monthly_rent
        label: Avg Rent
      - name: rent_per_square_foot
        label: Rent / sq ft

  - id: city
    label: City
    description: City containing one or more stores — the middle of the store location hierarchy. Belongs to exactly one region; store measures promote up into their city.
    display_field: city
    dimensions:
      - name: city
        label: City
      - name: region
        label: Region
    measures:
      # Own count (total_cities) is 1 per city instance, so it is omitted.
      # Induced up from this city's stores.
      - name: total_stores
        label: Stores
      - name: total_square_feet
        label: Floor Area
      - name: total_monthly_rent
        label: Monthly Rent
      - name: total_staff
        label: Staff
      - name: avg_square_feet
        label: Avg Floor Area
      - name: avg_monthly_rent
        label: Avg Rent
      - name: rent_per_square_foot
        label: Rent / sq ft

  - id: retail_store
    label: Store
    description: Physical retail store — location, floor area, rent, and staffing, grouped by region.
    display_field: store_name
    dimensions:
      - name: store_id
        label: Store ID
      - name: store_name
        label: Name
      - name: region
        label: Region
      - name: city
        label: City
      - name: opened_date
        label: Opened
      - name: square_feet
        label: Floor Area (sq ft)
      - name: monthly_rent
        label: Monthly Rent
      - name: staff_count
        label: Staff
    measures:
      # A store is a leaf row; the sums/averages over a single store read as
      # that store's own footprint, rent, and staffing.
      - name: total_square_feet
        label: Floor Area
      - name: total_monthly_rent
        label: Monthly Rent
      - name: total_staff
        label: Staff
      - name: rent_per_square_foot
        label: Rent / sq ft

  # ── Finance & operations side ────────────────────────────────────────────
  # These entities are monthly/daily rollups that live on the cost/revenue
  # half of the metric tree. They don't join into the fruit → order fiber, so
  # they surface as their own cluster in the graph — the P&L bottom line
  # (financials) and the cost/marketing drivers that feed it.

  - id: financials_month
    label: Financials (Monthly)
    description: Monthly P&L bottom line — gross/net revenue, payroll, operating cost, and operating profit computed at query time from orders, employees, and operating_costs.
    display_field: month
    dimensions:
      - name: month
        label: Month
    measures:
      # One row per accounting month; each measure is a real monthly sum
      # (or composite), so per-instance they read as that month's P&L.
      - name: gross_revenue
        label: Gross Revenue
      - name: net_revenue
        label: Net Revenue
      - name: operating_profit
        label: Operating Profit
      - name: operating_margin
        label: Operating Margin
      - name: payroll
        label: Payroll
      - name: total_op_cost
        label: Operating Cost
      - name: tax
        label: Tax
      - name: shipping
        label: Shipping

  - id: payroll_snapshot
    label: Payroll Snapshot
    description: Monthly headcount and payroll per department — the largest fixed cost feeding operating profit.
    display_field: department
    dimensions:
      - name: month
        label: Month
      - name: department
        label: Department
    measures:
      - name: total_headcount
        label: Headcount
      - name: salary_cost
        label: Salary Cost
      - name: benefits_cost
        label: Benefits Cost
      - name: fully_loaded_cost
        label: Fully-Loaded Cost
      - name: cost_per_head
        label: Cost per Head
      - name: avg_salary_per_head
        label: Avg Salary / Head

  - id: opex_event
    label: Operating Cost
    description: Daily operating expense by category and region (rent, logistics, packaging, fees, etc.) — a cost-side driver of net revenue.
    display_field: category
    dimensions:
      - name: cost_date
        label: Cost Date
      - name: category
        label: Category
      - name: region
        label: Region
    measures:
      - name: total_op_cost
        label: Total Operating Cost
      - name: logistics_cost
        label: Logistics
      - name: packaging_cost
        label: Packaging
      - name: fulfilment_cost
        label: Fulfilment (Logistics + Packaging)
      - name: payment_processing_fees
        label: Payment Fees
      - name: rent_cost
        label: Rent
      - name: software_licenses_cost
        label: Software Licenses

  - id: funnel_event
    label: Marketing Funnel
    description: Daily acquisition funnel by channel, region, and device — sessions → leads → signups → paid signups, the upstream drivers of revenue.
    display_field: channel
    dimensions:
      - name: event_date
        label: Event Date
      - name: channel
        label: Channel
      - name: region
        label: Region
      - name: device
        label: Device
    measures:
      - name: total_sessions
        label: Sessions
      - name: total_leads
        label: Leads
      - name: total_signups
        label: Signups
      - name: total_paid_signups
        label: Paid Signups
      - name: lead_rate
        label: Lead Rate
      - name: signup_rate
        label: Signup Rate
      - name: paid_conversion_rate
        label: Paid Conversion Rate
      - name: overall_conversion_rate
        label: Overall Conversion

  - id: spend_event
    label: Marketing Spend
    description: Daily marketing spend, clicks, and impressions per channel — the top of the predict_impact chain (spend → sessions → revenue).
    display_field: channel
    dimensions:
      - name: event_date
        label: Event Date
      - name: channel
        label: Channel
    measures:
      - name: total_spend
        label: Spend
      - name: total_clicks
        label: Clicks
      - name: total_impressions
        label: Impressions
      - name: cost_per_click
        label: Cost per Click
      - name: click_through_rate
        label: Click-Through Rate
