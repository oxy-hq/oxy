name: oxymart_store_pulse
description: |
  Tasks backing the `store-pulse-app` custom app — a single-store
  drill-in that lets the customer pick a store and inspect its
  totals + recent weeks. Pairs 1:1 with the manifest at
  `examples/store-pulse-app/public/oxy-app.json`.

  All three tasks are parameterised by `?p[store]=N` (forwarded by
  the SDK as `controls.store`). `store_list` ignores the param and
  returns the picker options; the other two filter to one store.

# `controls` declares the params the bundle may send. Listing them
# here even when defaults are unused keeps the YAML self-documenting
# and validates the shape on load.
controls:
  - name: store
    type: text
    default: '1'

tasks:
  # Populates the store picker. Returns one row per Store in the CSV;
  # the bundle's `StoreOption` type only reads `Store` so extra
  # columns are harmless if you ever want to add (e.g.) a label.
  - name: store_list
    type: execute_sql
    database: local
    sql_query: |
      SELECT CAST(Store AS VARCHAR) AS Store
      FROM oxymart
      GROUP BY Store
      ORDER BY CAST(Store AS INTEGER)

  # Per-store rollup. Bundle expects:
  #   { Store, first_week, last_week, total_sales, avg_weekly_sales,
  #     weeks_observed }
  # Filtered by `controls.store`; when the param is missing /
  # malformed the COALESCE-via-TRY_CAST falls back to Store 1 so the
  # endpoint never returns an empty result for a defaulted call.
  - name: store_summary
    type: execute_sql
    database: local
    sql_query: |
      SELECT
        CAST(Store AS VARCHAR) AS Store,
        MIN(CAST(Date AS VARCHAR)) AS first_week,
        MAX(CAST(Date AS VARCHAR)) AS last_week,
        SUM(Weekly_Sales) AS total_sales,
        AVG(Weekly_Sales) AS avg_weekly_sales,
        COUNT(*) AS weeks_observed
      FROM oxymart
      WHERE CAST(Store AS VARCHAR) = {{ controls.store | sqlquote }}
      GROUP BY Store

  # Weekly sales for the selected store, most recent ~12 weeks first.
  # Bundle expects: { Date, Weekly_Sales, Holiday_Flag }.
  - name: recent_sales
    type: execute_sql
    database: local
    sql_query: |
      SELECT
        CAST(Date AS VARCHAR) AS Date,
        Weekly_Sales,
        Holiday_Flag
      FROM oxymart
      WHERE CAST(Store AS VARCHAR) = {{ controls.store | sqlquote }}
      ORDER BY Date DESC
      LIMIT 12

published: true
