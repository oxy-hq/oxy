name: orders
description: Customer orders with shipping and payment information
datasource: local
table: "orders.csv"

refresh_key:
  every: "1h"

pre_aggregations:
  # covers: kpis_orders task — all 5 KPI measures with order_date filterable
  # via the monthly time dimension. customer_id ends up in the rollup
  # GROUP BY because of distinct_customers_with_orders, so the rollup is
  # at (month, customer_id) grain — re-aggregation collapses it back to
  # the requested grain.
  - name: orders_kpis_by_month
    measures:
      - total_orders
      - total_order_value
      - avg_order_value
      - distinct_customers_with_orders
      - total_shipping_costs
    time_dimension: order_date
    granularity: month
    refresh_key:
      every: 1h

  - name: orders_by_month
    dimensions:
      - order_status
    measures:
      - total_orders
      - total_order_value
      - total_shipping_costs
    time_dimension: order_date
    granularity: month
    refresh_key:
      every: 1h

  - name: orders_by_customer
    dimensions:
      - customer_id
      - order_status
    measures:
      - total_orders
      - total_order_value
    refresh_key:
      every: 1h

  - name: orders_summary
    measures:
      - total_orders
      - total_order_value
      - avg_order_value
      - distinct_customers_with_orders
      - total_shipping_costs
    refresh_key:
      every: 1h

  - name: orders_by_status
    dimensions:
      - order_status
    measures:
      - total_orders
      - total_order_value
    refresh_key:
      every: 1h
entities:
- name: order
  type: primary
  description: Primary order entity
  key: order_id
  parent: customer
- name: customer
  type: foreign
  description: Customer who placed the order
  key: customer_id
- name: shipping_address
  type: foreign
  description: Shipping address for the order
  key: shipping_address_id
dimensions:
- name: order_id
  type: number
  description: Unique order identifier
  expr: id
- name: customer_id
  type: number
  description: Unique customer identifier
  expr: customer_id
- name: shipping_address_id
  type: number
  description: Shipping address identifier
  expr: shipping_address_id
- name: order_date
  type: date
  description: Date when order was placed
  expr: order_date
- name: order_status
  type: string
  description: Current status of the order
  expr: status
- name: total_amount
  type: number
  description: Total order amount
  expr: total_amount
- name: shipping_cost
  type: number
  description: Cost of shipping
  expr: shipping_cost
- name: tax_amount
  type: number
  description: Tax amount for the order
  expr: tax_amount
measures:
- name: total_orders
  type: count
  description: Number of orders
- name: total_order_value
  type: sum
  description: Total value of all orders
  expr: total_amount
- name: avg_order_value
  type: average
  description: Average order value
  expr: total_amount
- name: total_shipping_costs
  type: sum
  description: Total shipping costs
  expr: shipping_cost
- name: total_tax_collected
  type: sum
  description: Total tax collected
  expr: tax_amount
- name: distinct_customers_with_orders
  type: count_distinct
  description: Number of distinct customers with orders
  expr: customer_id
- name: net_revenue
  type: custom
  description: |
    Net revenue = total order value minus shipping costs and tax.
    Composite of three additive measures so the metric tree shows
    component edges for each sub-measure.
  expr: "{{orders.total_order_value}} - {{orders.total_shipping_costs}} - {{orders.total_tax_collected}}"
- name: revenue_volume_x_price
  type: custom
  description: |
    Multiplicative composite: order volume × average order price.
    Mathematically equivalent to total_order_value but expressed as a
    product so explain_metric runs log-share decomposition — "X% from
    more orders, Y% from higher avg price".
  expr: "{{orders.total_orders}} * {{orders.avg_order_value}}"