# oxy-hq/publish-action — publish a built custom-app bundle to Oxy via trusted
# publishing (design: internal-docs/2026-07-15-app-publishing-auth-design.md).
#
# No stored secret. The action mints a GitHub Actions OIDC token, exchanges it for
# a short-lived, app-scoped Oxy publish credential, and uploads the bundle. It must
# run in a job that has `id-token: write` — and, ideally, in an isolated publish
# job whose only steps are download-artifact + this action (see `oxy init-ci`).
name: Publish to Oxy
description: Publish a built custom-app bundle to Oxy via GitHub Actions OIDC (no stored secret).
branding:
  icon: upload-cloud
  color: blue

inputs:
  app:
    description: 'The app to publish, "org-slug/app-slug".'
    required: true
  dir:
    description: 'Directory containing the built bundle (must include index.html).'
    required: true
    default: dist
  target:
    description: 'Oxy base URL to publish to.'
    required: false
    default: https://app.oxygen-hq.com
  promote:
    description: 'Promote to the published channel (else draft).'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        OXY_APP: ${{ inputs.app }}
        OXY_DIR: ${{ inputs.dir }}
        OXY_TARGET: ${{ inputs.target }}
        OXY_PROMOTE: ${{ inputs.promote }}
      run: ${{ github.action_path }}/publish.sh
