name: confounded
description: |
  The modal customer. Budget is set as a share of trailing sales, so the
  regressor tracks the demand shock. This is the world the whole exercise is
  about, and the one we expect to hurt.

  No `policy:` here, and that is the point: hold / legacy / machine /
  machine_explore / oracle are arms of a race over THIS world, chosen when a run
  is queued. Four files differing by one line were four worlds that happened to
  look alike, and a race between them measured nothing.

seed: 7
# Clean identification and low noise: one draw settles it. The corners that
# need more say so themselves.
replicates: 1
periods: 30
period_days: 7
history_days: 180
start_date: 2025-01-06

entities:
  count: 24
  scale_sigma: 0.4

baseline:
  sales_per_entity_day: 1500.0
  margin: 0.36
  demand_shock_rho: 0.7
  demand_shock_sd: 0.12
  weekly_seasonality: 0.15

mechanism:
  driver: marketing_spend
  target: net_sales
  lag_days: 7
  noise_ratio: 0.05
  calibrate:
    anchor_spend_share: 0.02
    local_slope_at_anchor: 4.0
    optimum_at: 3.0

lever:
  min_multiple: 0.1
  max_multiple: 5.0
  max_move_per_period: 0.25
  explore_jitter_sd: 0.15
