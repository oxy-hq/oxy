name: moderate_confounding
description: |
  The confounding axis had two points — `clean` at rho 0.0 and `confounded` at
  rho 0.7 — and nothing in between, so the map's middle row was never actually
  declared. Half the shock persistence and half the shock size: rho 0.35,
  demand_shock_sd 0.06. Same jitter as `confounded`, so this isolates what the
  confounding knob alone does to the bias, rather than moving two axes at once.

  Measured (`oxy_simulation::check`): bias 1.070, against `clean`'s 1.026 and
  `confounded`'s 1.066 on the same seed. Halving both shock knobs did not halve
  the bias — it lands at essentially `confounded`'s number. Bias saturates fast
  with confounding strength here; it does not fall off linearly with rho.

seed: 7
periods: 30
period_days: 7
history_days: 180
start_date: 2025-01-06

entities:
  count: 24
  scale_sigma: 0.4

baseline:
  sales_per_entity_day: 1500.0
  margin: 0.36
  demand_shock_rho: 0.35
  demand_shock_sd: 0.06
  weekly_seasonality: 0.15

mechanism:
  driver: marketing_spend
  target: net_sales
  lag_days: 7
  noise_ratio: 0.05
  calibrate:
    anchor_spend_share: 0.02
    local_slope_at_anchor: 4.0
    optimum_at: 3.0

lever:
  min_multiple: 0.1
  max_multiple: 5.0
  max_move_per_period: 0.25
  explore_jitter_sd: 0.15
