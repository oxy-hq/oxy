[workspace]
members = [
  "crates/billing",
  "crates/app",
  "crates/auth",
  "crates/authz",
  "crates/cameras",
  "crates/core",
  "crates/entity",
  "crates/git",
  "crates/integration/looker",
  "crates/integration/slack-client",
  "crates/metric-monitoring",
  "crates/integration/unifi",
  "crates/migration",
  "crates/oxy-compile",
  "crates/integration/omni",
  "crates/observability",
  "crates/project",
  "crates/semantic",
  "crates/shared",
  "crates/test-utils",
  "crates/infrastructure/llm/anthropic",
  "crates/infrastructure/llm/ollama",
  "crates/infrastructure/llm/gemini",
  "crates/infrastructure/llm/openai",
  "crates/infrastructure/llm/oxy-llm",
  "crates/infrastructure/semantic",
  "crates/agentic/analytics",
  "crates/agentic/airway",
  "crates/agentic/builder",
  "crates/agentic/core",
  "crates/agentic/llm",
  "crates/agentic/connector",
  "crates/agentic/http",
  "crates/agentic/pipeline",
  "crates/agentic/runtime",
  "crates/agentic/semantic",
  "crates/agentic/automation",
  "crates/airform",
  "crates/airhouse",
  "crates/platform",
  "crates/workspace-fs",
  "web-app",
]

exclude = [
  "docs",
  "internal-docs",
  "tests",
  "scripts",
  "assets",
  "oss",
  "json-schemas",
  "semantics",
  "sdk",
]

default-members = ["crates/app"]
resolver = "2"

[workspace.dependencies]
# Internal workspace crates
agentic-airway = { path = "crates/agentic/airway" }
agentic-analytics = { path = "crates/agentic/analytics" }
agentic-builder = { path = "crates/agentic/builder" }
agentic-connector = { path = "crates/agentic/connector" }
agentic-core = { path = "crates/agentic/core" }
agentic-http = { path = "crates/agentic/http" }
agentic-llm = { path = "crates/agentic/llm" }
agentic-pipeline = { path = "crates/agentic/pipeline" }
agentic-runtime = { path = "crates/agentic/runtime" }
agentic-semantic = { path = "crates/agentic/semantic" }
agentic-automation = { path = "crates/agentic/automation" }
airhouse = { path = "crates/airhouse" }
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }
omni = { path = "crates/integration/omni" }
oxy = { path = "crates/core" }
oxy-airlayer-compat = { path = "crates/infrastructure/semantic" }
oxy-anthropic = { path = "crates/infrastructure/llm/anthropic" }
oxy-auth = { path = "crates/auth" }
oxy-authz = { path = "crates/authz" }
oxy-billing = { path = "crates/billing" }
oxy-cameras = { path = "crates/cameras" }
oxy-compile = { path = "crates/oxy-compile" }
oxy-gemini = { path = "crates/infrastructure/llm/gemini" }
oxy-git = { path = "crates/git" }
oxy-llm = { path = "crates/infrastructure/llm/oxy-llm" }
oxy-looker = { path = "crates/integration/looker" }
oxy-slack-client = { path = "crates/integration/slack-client" }
oxy-metric-monitoring = { path = "crates/metric-monitoring" }
oxy-observability = { path = "crates/observability" }
oxy-ollama = { path = "crates/infrastructure/llm/ollama" }
oxy-airform = { path = "crates/airform" }
oxy-openai = { path = "crates/infrastructure/llm/openai" }
oxy-platform = { path = "crates/platform" }
oxy-project = { path = "crates/project" }
oxy-semantic = { path = "crates/semantic" }
oxy-shared = { path = "crates/shared" }
oxy-test-utils = { path = "crates/test-utils" }
oxy-unifi = { path = "crates/integration/unifi" }
oxy-workspace-fs = { path = "crates/workspace-fs" }

# External dependencies
async-openai = { version = "0.35.0" }
duckdb = { version = "=1.10501.0", features = ["bundled"] }
axum = { version = "0.8.9", features = ["macros", "http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = "*"
chrono-tz = "0.8"
croner = "3"
indexmap = { version = "2.14.0", features = ["serde"] }
log = { version = "0.4" }
minijinja = { version = "2.21.0" }
regex = { version = "1.13.1" }
sea-orm = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
] }
sea-orm-migration = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-uuid",
] }
sentry = { version = "0.47.0", features = [
  "tower-axum-matched-path",
  "rustls",
  "tracing",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde_yaml = { version = "0.9.34" }
sqlparser = { version = "0.61" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.19" }
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1.44" }
uuid = { version = "1.24", features = ["serde", "v4"] }
aes-gcm = "0.10.3"
aho-corasick = "1.1"
airlayer = { git = "https://github.com/oxy-hq/airlayer", rev = "474f461a609c45554301a84aa37ffff8a68bb32c" }
# Anomaly detection: ETS forecasting + MSTL decomposition. augurs-ets gives
# Holt-Winters family (with auto model selection); augurs-mstl handles
# multi-seasonality (daily + weekly + yearly). Pulled in by oxy-metric-monitoring.
augurs-core = "0.10.2"
augurs-ets = "0.10.2"
augurs-mstl = "0.10.2"
anyhow = "1.0.104"
apalis = "0.7.4"
apalis-core = "0.7.4"
apalis-sql = "0.7.4"
argon2 = "0.5"
arrow = { version = "=58.3.0", default-features = false }
assert_cmd = "2.2.2"
async-std = "1.13.2"
async-stream = "0.3.6"
async-trait = "0.1.91"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"
aws-sigv4 = "1"
backoff = "0.4.0"
base64 = "0.22"
bcrypt = "0.19.2"
bollard = "0.20.2"
chrono-english = "0.1.8"
clap = "4.6.4"
clickhouse = "0.15.1"
colored = "3.1.1"
connectorx = "0.4.5"
constant_time_eq = "0.5.0"
csv = "1.4.0"
dashmap = "6"
deser-incomplete = "0.1.2"
df-interchange = "0.3.3"
dirs = "6.0.0"
dotenv = "0.15.0"
email_address = "0.2.9"
enum_dispatch = "0.3.13"
fehler = "1.0.0"
flate2 = "1"
futures = "0.3.33"
futures-core = "0.3"
fxhash = "0.2.1"
garde = "0.22.1"
gcp-bigquery-client = "0.25.1"
git2 = "0.20.4"
glob = "0.3.4"
governor = "0.10"
handlebars = "6"
headless_chrome = "1.0"
hex = "0.4.3"
hmac = "0.13.0"
home = "0.5"
http = "1.4"
human-panic = "2.0.8"
humantime = "2.4.0"
include_dir = "0.7"
indicatif = "0.18"
indoc = "2.0.7"
itertools = "0.14.0"
jsonschema = "0.33.0"
jsonwebtoken = "10"
lazy_static = "1.5.0"
lettre = "0.11.22"
libc = "0.2"
linfa = "0.8.1"
linfa-reduction = "0.8.1"
lru = "0.16"
ndarray = "0.16.1"
once_cell = "1.21.4"
parking_lot = "0.12"
parquet = "=58.3.0"
predicates = "3.1.4"
pulldown-cmark = "0.13"
rand = "0.10"
rapidfuzz = "0.5.0"
reqwest = { version = "0.12", features = ["rustls-tls", "multipart"] }
# V8-isolate runtime for Oxy Functions (custom-app `functions/*.ts`).
# See internal-docs/2026-06-12-customer-apps-functions-design.md.
deno_core = "0.331"
# deno_core 0.331's `op2` macro requires fallible ops to return an error type
# implementing `deno_error::JsErrorClass` (plain `anyhow::Error` no longer
# qualifies); `JsErrorBox` is that type. Kept on the 0.5.x line deno_core pins.
deno_error = "0.5"
rkyv = "0.7.46"
rmcp = "0.10.0"
rusqlite = "0.32"
rustc_version_runtime = "0.3.0"
rustls = "0.23.42"
schemars = "0.8.22"
scopeguard = "1.2.0"
secrecy = "0.10.3"
self_update = "0.42.0"
semver = "1.0"
serde_arrow = "0.14.2"
serde_jcs = "0.1.0"
serde_urlencoded = "0.7"
serde_with = "3.21.0"
serial_test = "3.5.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
short-uuid = "0.2.1"
slugify = "0.1.0"
snowflake-api = { git = "https://github.com/oxy-hq/snowflake-rs.git", tag = "v0.13.2-browser-auth" }
sqlformat = { git = "https://github.com/shssoichiro/sqlformat-rs.git", rev = "80255c7" }
sqlx = "0.8"
statrs = "0.18"
strip-ansi-escapes = "=0.2.1"
strsim = "0.11"
syntect = "5.3"
tabled = "0.20.0"
terminal-light = "1.9.0"
terminal_size = "0.4.4"
tokio-postgres = "0.7"
# tokio-postgres TLS connector backed by rustls. Matches the workspace's
# existing rustls-based Postgres TLS stack (sqlx uses runtime-tokio-rustls),
# avoiding a parallel OpenSSL dependency.
tokio-postgres-rustls = "0.13"
tokio-stream = "0.1.19"
# Mozilla root certificate bundle — RDS certs chain to public CAs already
# present here, so we don't need OS trust store integration for the
# task-router's LISTEN connection.
webpki-roots = "0.26"
tar = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.3"
tower-http = "0.6.11"
tower-serve-static = "0.1.2"
tqdm = "0.8.0"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
url = "2.5.8"
urlencoding = "2.1.3"
utoipa = { git = "https://github.com/haitrr/utoipa.git", rev = "776f86e" }
utoipa-axum = { git = "https://github.com/haitrr/utoipa.git", rev = "776f86e" }
utoipa-swagger-ui = { git = "https://github.com/haitrr/utoipa.git", rev = "776f86e" }
wildcard = "0.3.0"
wiremock = "0.6"
xxhash-rust = "0.8"

# Airform — dbt-compatible SQL transformation engine
airform-core = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
# `postgres` feature is required for the real Airhouse / Postgres
# destinations (without it airway compiles a stub that errors at run
# time). `default-features` stays on so `duckdb` is still available.
# Pinned to release tag 0.1.22: end-of-load fold outcomes on `LoadInfo::folds`
# / `PipelineEvent::LoadCompleted.folds` (used to tell "written" from
# "queryable") plus the fold-failure-fails-the-run + `_aw_loads` audit fix.
# Supersedes 0.1.21 (reset-schema `drop_tables`) and 0.1.20 (resumable
# backfill), both still carried.
airway = { git = "https://github.com/oxy-hq/airway-internal.git", tag = "0.1.22", features = [
  "postgres",
] }
airform-loader = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-parser = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-jinja = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-graph = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-compiler = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-analyzer = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }
airform-executor = { git = "https://github.com/oxy-hq/airform.git", rev = "3e3e8288692381a989444eef874900e6db4475b1" }

[workspace.package]
version = "0.5.111"
authors = ["oxy engineers"]
description = "Oxy"
documentation = "https://oxygen-hq.com/docs"
edition = "2024"
exclude = []
publish = false
rust-version = "1.97.1"

[profile.dev.package]
# Disable optimization for native build dependencies to speed up dev builds
# These crates have build scripts that compile native code and always trigger rebuilds
aws-lc-sys = { opt-level = 0 }
libduckdb-sys = { opt-level = 0 }
lz4-sys = { opt-level = 0 }
onig_sys = { opt-level = 0 }
openssl-sys = { opt-level = 0 }
ring = { opt-level = 0 }
# Large/complex crates that benefit from reduced optimization in dev
aws-sdk-sts = { opt-level = 0 }
datafusion-common = { opt-level = 0 }
parquet = { opt-level = 0 }
sqlx-postgres = { opt-level = 0 }

[profile.dev]
split-debuginfo = "shallow"
# Line tables only (not full DWARF). Measured 2026-07-21 on a free 8-core box:
# a warm one-file `cargo build -p oxy-app` incremental drops 146s -> 73s (-50%),
# because the bin link + dsymutil write far less debug info. Backtraces keep file
# + line numbers; interactive debuggers (lldb) lose local-variable inspection —
# an accepted trade for this build-heavy workspace. `-C debuginfo=2` per-command
# restores full DWARF if you need to step-debug.
debug = "line-tables-only"
