<svg viewBox="0 0 1560 860" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="physicsFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2e"/>
      <stop offset="1" stop-color="#0a2c23"/>
    </linearGradient>
    <linearGradient id="controlFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="1" stop-color="#1c1a4e"/>
    </linearGradient>
    <linearGradient id="calibrationFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a0c"/>
      <stop offset="1" stop-color="#2a1e08"/>
    </linearGradient>
  </defs>

  <!-- Outer container -->
  <rect x="20" y="20" width="1520" height="820" rx="28" fill="#0b0f1a" stroke="#2b3446" stroke-width="2"/>
  <text x="780" y="78" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="700">World Model</text>

  <!-- ===================== Physics layer ===================== -->
  <rect x="64" y="112" width="620" height="420" rx="20" fill="url(#physicsFill)" stroke="#10b981" stroke-width="2"/>
  <text x="374" y="160" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Physics layer</text>
  <text x="374" y="190" text-anchor="middle" fill="#a7f3d0" font-size="17">What the business is</text>

  <rect x="112" y="216" width="524" height="88" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="374" y="252" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Semantic model</text>
  <text x="374" y="282" text-anchor="middle" fill="#7d8ea6" font-size="15">measures and dimensions, compiled to correct SQL</text>

  <rect x="112" y="320" width="524" height="88" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="374" y="356" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Metric tree</text>
  <text x="374" y="386" text-anchor="middle" fill="#7d8ea6" font-size="15">arithmetic identities + the declared driver map</text>

  <rect x="112" y="424" width="524" height="88" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="374" y="460" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Entity graph</text>
  <text x="374" y="490" text-anchor="middle" fill="#7d8ea6" font-size="15">objects, automatic joins, hierarchy</text>

  <!-- ===================== Control layer ===================== -->
  <rect x="876" y="112" width="620" height="420" rx="20" fill="url(#controlFill)" stroke="#6366f1" stroke-width="2"/>
  <text x="1186" y="160" text-anchor="middle" fill="#a5b4fc" font-size="27" font-weight="700">Control layer</text>
  <text x="1186" y="190" text-anchor="middle" fill="#c7d2fe" font-size="17">What the business does</text>

  <rect x="924" y="216" width="524" height="150" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1186" y="252" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Controls (versioned)</text>
  <text x="1186" y="278" text-anchor="middle" fill="#7d8ea6" font-size="15">criteria + action</text>
  <rect x="952" y="300" width="146" height="44" rx="10" fill="#141a2e" stroke="#4f4c9e" stroke-width="1.2"/>
  <text x="1025" y="328" text-anchor="middle" fill="#c7d2fe" font-size="16">anomaly</text>
  <rect x="1113" y="300" width="146" height="44" rx="10" fill="#141a2e" stroke="#4f4c9e" stroke-width="1.2"/>
  <text x="1186" y="328" text-anchor="middle" fill="#c7d2fe" font-size="16">opportunity</text>
  <rect x="1274" y="300" width="146" height="44" rx="10" fill="#141a2e" stroke="#4f4c9e" stroke-width="1.2"/>
  <text x="1347" y="328" text-anchor="middle" fill="#c7d2fe" font-size="16">trigger</text>

  <line x1="1186" y1="366" x2="1186" y2="404" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1204" y="391" fill="#94a3b8" font-size="14">act, then measure</text>

  <rect x="924" y="408" width="524" height="104" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1186" y="448" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Evaluation</text>
  <text x="1186" y="478" text-anchor="middle" fill="#7d8ea6" font-size="15">backtests, pre/post, priced firings</text>

  <!-- ===================== Calibration layer ===================== -->
  <rect x="64" y="600" width="1432" height="212" rx="20" fill="url(#calibrationFill)" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="644" text-anchor="middle" fill="#fbbf24" font-size="27" font-weight="700">Calibration layer</text>
  <text x="780" y="674" text-anchor="middle" fill="#fde68a" font-size="17">What the business has learned</text>

  <rect x="112" y="700" width="400" height="88" rx="12" fill="#0b1220" stroke="#5c4413" stroke-width="1.5"/>
  <text x="312" y="736" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Forecasts</text>
  <text x="312" y="766" text-anchor="middle" fill="#7d8ea6" font-size="15">expected values, with envelopes</text>

  <rect x="580" y="700" width="400" height="88" rx="12" fill="#0b1220" stroke="#5c4413" stroke-width="1.5"/>
  <text x="780" y="736" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Online estimation</text>
  <text x="780" y="766" text-anchor="middle" fill="#7d8ea6" font-size="15">driver coefficients, lags, provenance</text>

  <rect x="1048" y="700" width="400" height="88" rx="12" fill="#0b1220" stroke="#5c4413" stroke-width="1.5"/>
  <text x="1248" y="736" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Drift monitoring</text>
  <text x="1248" y="766" text-anchor="middle" fill="#7d8ea6" font-size="15">prediction vs. outcome, per component</text>

  <!-- ===================== Cross-layer arrows ===================== -->
  <!-- Physics feeds controls -->
  <line x1="684" y1="290" x2="872" y2="290" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="778" y="274" text-anchor="middle" fill="#cbd5e1" font-size="15">criteria read</text>

  <!-- Observations flow from physics into calibration -->
  <line x1="560" y1="532" x2="560" y2="596" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="578" y="570" fill="#cbd5e1" font-size="15">observations</text>

  <!-- Evaluation results flow into calibration -->
  <line x1="1186" y1="532" x2="1186" y2="596" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="1204" y="570" fill="#fbbf24" font-size="15">measured impact</text>

  <!-- Calibration updates physics -->
  <line x1="200" y1="596" x2="200" y2="536" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="218" y="570" fill="#fbbf24" font-size="15">updates the physics</text>

</svg>
