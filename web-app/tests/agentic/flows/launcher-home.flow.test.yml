# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Smoke tests for the shell-v2 launcher. Chrome is a narrow left icon
# rail ([data-testid=shell-rail]) on every workspace page outside /ide:
# rail-hq returns home, rail-threads / rail-automations navigate to the
# routed list pages (the old list modals are gone), rail-core opens
# Oxygen Factory (the IDE). There is no top bar anywhere.
#
# When there are zero published custom apps (the local CI backend's case),
# home renders the **ask-forward fallback**: greeting + the ChatPanel
# composer. The HQ heading renders only on the apps grid, so these cases
# assert the rail + fallback, not the heading.
#
#   fallback-home        — greeting + composer visible; rail items
#                          (HQ / Threads / Automations / Oxygen Factory) visible.
#   ask-pill-roundtrip   — [data-testid=ask-pill] opens [data-testid=ask-panel];
#                          submitting streams into the right-side drawer
#                          ([data-testid=thread-drawer]) with no navigation;
#                          "Full view" promotes to /threads/<id>.
#   rail-pages-and-home  — rail-automations lands on the Automations list
#                          page, rail-threads on the Threads list page,
#                          rail-hq returns to the launcher.
#
# Backend mode: local (`oxy start --local --enterprise` at demo_project/).
# Auth is disabled, so there is no login step.

name: launcher home surfaces
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  backend_mode: local
  # fallback-home: 3 steps. ask-pill-roundtrip: 7 steps (click pill + wait
  # panel + submit + wait drawer + wait stream + full view + wait). rail-
  # pages-and-home: 6 steps (three rail clicks + three page waits). Pad
  # generously.
  max_steps: 20

setup:
  - "goto:/"

cases:
  - name: fallback-home shows greeting, chat composer, and the rail
    tags: [launcher, chat, critical]
    steps:
      # The fallback greeting is time-of-day-aware ("Good Morning/Afternoon/
      # Evening"). The selector covers the outer paragraph regardless of
      # which greeting string is rendered.
      - wait_for: "selector:text=How can I assist you?"

      - wait_for: "selector:[data-testid=agent-selector-button]"

      - act: |
          Verify the icon rail is present on the left edge. Do NOT click
          anything — browser_snapshot and check for [data-testid=shell-rail],
          [data-testid=rail-hq], [data-testid=rail-threads],
          [data-testid=rail-automations], and [data-testid=rail-core].

    expect:
      - assert: "selector [data-testid=chat-panel-submit-button] is visible"
      - assert: "selector [data-testid=agent-selector-button] is visible"
      - assert: "selector [data-testid=shell-rail] is visible"
      - assert: "selector [data-testid=rail-threads] is visible"
      - assert: "selector [data-testid=rail-automations] is visible"
      - assert: "selector [data-testid=rail-core] is visible"

  - name: ask-pill-roundtrip submits into the thread drawer and promotes to full view
    tags: [launcher, chat, critical]
    steps:
      - wait_for: "selector:[data-testid=ask-pill]"

      - act: |
          browser_click [data-testid=ask-pill]. The Ask panel expands
          from the bottom of the page; [data-testid=ask-panel] becomes
          visible with a ChatPanel inside it.

      - wait_for: "selector:[data-testid=ask-panel]"

      # Submit a question through the Ask panel. Submitting does NOT
      # navigate: the panel closes and the new thread streams inside the
      # right-side drawer.
      - act: |
          Submit a question via the Ask panel:
          1. browser_type into textarea[name=question] inside
             [data-testid=ask-panel]: "What were the total weekly sales by store?"
          2. browser_click [data-testid=chat-panel-submit-button].
          End the turn once the thread drawer ([data-testid=thread-drawer])
          opens on the right — the URL does not change.

      - wait_for: "selector:[data-testid=thread-drawer]"

      - wait_for: streaming_complete

      # Promote the drawer thread to the routed full view. The full page
      # has no top bar — the rail is the chrome; the thread input's send
      # button marks the routed page as loaded.
      - act: |
          browser_click [data-testid=thread-drawer-open-full]. The drawer
          closes and the URL changes to /threads/<id> — the full thread
          page, with the icon rail still on the left edge.

      - wait_for: "selector:[data-testid=message-input-send-button]"

    expect:
      - assert: "selector [data-testid=shell-rail] is visible"
      - judge: |
          The page is on a /threads/<id> URL showing the full thread view.
          The analytics agent answered the "total weekly sales by store"
          question with a coherent, data-backed result — per-store sales
          figures as a table, chart, or written summary. No error banner
          is visible and the run is not suspended awaiting a clarifying
          question.

  - name: rail-pages-and-home navigates Automations and Threads pages from the rail
    tags: [launcher, regression]
    steps:
      - wait_for: "selector:[data-testid=rail-automations]"

      - act: |
          browser_click [data-testid=rail-automations]. The app navigates
          to the Automations list page
          ([data-testid=automations-list-page]) — a routed page, not a
          modal; the rail stays on the left edge.

      - wait_for: "selector:[data-testid=automations-list-page]"

      - act: |
          browser_click [data-testid=rail-threads]. The app navigates to
          the Threads list page ([data-testid=threads-list-page]).

      - wait_for: "selector:[data-testid=threads-list-page]"

      - act: |
          browser_click [data-testid=rail-hq]. The app returns to the
          launcher home — the greeting/composer fallback renders (zero
          published custom apps on this backend).

      - wait_for: "selector:text=How can I assist you?"

    # Rows may be empty on a cold backend — assert only the page shells.
    expect:
      - assert: "selector [data-testid=shell-rail] is visible"
      - assert: "selector [data-testid=chat-panel-submit-button] is visible"
