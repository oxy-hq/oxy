# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Verify the agent-selector dropdown renders and reflects the selected
# agent. This flow used to switch between two demo agents (a classic
# `default` + the agentic `analytics`); #2346 removed the classic agent,
# so the demo now ships a single agent — `analytics` (analytics.agentic.yml).
# With one agent there is no "switch" to exercise, so this is now a selector
# smoke check: open the dropdown, confirm the analytics agent is listed and
# selectable, and the trigger reflects it. (If the demo regains a second
# agent, restore the switch assertions from git history.)

name: chat panel agent selector
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  backend_mode: local
  max_steps: 15

setup:
  - "goto:/"

cases:
  - name: agent selector lists and selects the analytics agent
    tags: [chat, regression]
    steps:
      - wait_for: "selector:[data-testid=agent-selector-button]"

      - act: |
          browser_click [data-testid=agent-selector-button] to open the
          agent dropdown.

      # The dropdown renders one menuitem per available agent. The demo ships
      # a single agent — `analytics`. Gate on that menuitem so a selector that
      # fails to load its agents (the known "selector shows undefined/empty"
      # race) fails here deterministically, instead of slipping past a judge
      # the initial trigger label already satisfies.
      - wait_for: "selector:role=menuitem[name='analytics'];timeout_ms=10000"

      - act: |
          browser_click `role=menuitem[name='analytics']` to select the
          agent; the dropdown closes and the trigger button reflects
          'analytics'.

    expect:
      - assert: "selector [data-testid=agent-selector-button] is visible"
      - judge: |
          The home/chat surface is shown, the agent selector button is
          visible and reads 'analytics', and no error banner is present.
