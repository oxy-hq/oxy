    - "src/hooks/api/adminPartners/"
    - "src/services/api/adminPartners.ts"
    - "src/types/adminPartners.ts"
  flows:
    - admin-tenants-cockpit

- surface: admin-customer-apps
  paths:
    - "src/pages/admin/AdminCustomApps/"
    - "src/pages/admin/AdminPublishTokens/"
  flows:
    - admin-custom-apps-tabs
    - customer-apps-oxy-starter-fleet

- surface: partners-console
  paths:
    - "src/pages/partners/"
    - "src/components/admin/AssumeRoleDialog.tsx"
    - "src/components/admin/AssumeBanner.tsx"
    - "src/hooks/api/partners/"
    - "src/hooks/api/adminAssume/"
  flows:
    - partners-console-fleet

- surface: automations
  paths:
    - "src/pages/automation/"
    - "src/components/automation/"
    - "src/hooks/api/agentic-automations/"
    - "src/services/api/automations.ts"
  flows:
    - automations-run-from-list

- surface: data-apps
  paths:
    - "src/pages/app/"
    - "src/components/AppPreview/"
    - "src/hooks/api/apps/"
    - "src/services/api/apps.ts"
  flows:
    - apps-data-app-charts
    - ide-unavailable-fleet

- surface: ide-availability
  paths:
    - "src/components/IdeUnavailableBanner/"
    - "src/components/ui/IdeUnavailablePanel.tsx"
    - "src/libs/utils/ideHealth.ts"
    - "src/hooks/useIdeHealth.ts"
  flows:
