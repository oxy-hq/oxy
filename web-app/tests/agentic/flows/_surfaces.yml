    - "src/pages/ide/Files/Editor/Topic/"
    - "src/pages/ide/Files/Editor/View/"
    - "src/pages/ide/Files/Editor/components/SemanticExplorer/"
    - "src/pages/ide/Files/Editor/components/SemanticQueryPanel/"
    - "src/hooks/api/useTopicFiles.ts"
