# Map of source-path globs → agentic browser test flows that exercise
# them. Read by `pnpm test:agentic --check-coverage --staged` (also
# wired into the husky pre-commit hook) to print an advisory list of
# flows worth re-running when the touched paths overlap. Advisory only
# — never blocks a commit.
#
# Path patterns are substring-prefixed (e.g. "src/pages/home/" matches
# any file under that directory). Use the new flow file's name (without
# the .flow.test.yml suffix). Keep paths relative to web-app/.

- surface: chat-panel
  paths:
    - "src/pages/launcher/"
    - "src/components/Chat/"
    - "src/components/Ask/"
    # The app dock is a flex sibling of the Ask dock and closes it on open, so
    # a change to either can move the other's layout. Shared hook included for
    # the same reason.
    - "src/components/apps/AppDock/"
    - "src/hooks/useResizableDock.ts"
    - "src/stores/useAppDock.ts"
  flows:
    - chat-ask
    - chat-ask-fleet
    - chat-panel-agent-switch
    - launcher-home

- surface: ide
  paths:
    - "src/pages/ide/"
  flows:
    - ide-save
    - ide-create-file
    - ide-compile-error
    - ide-database-fleet

- surface: builder
  paths:
    - "src/components/BuilderDialog/"
  flows:
    - builder-edits-app

- surface: onboarding
  paths:
    - "src/pages/onboarding/"
    - "src/components/workspaces/components/CreateWorkspaceDialog/"
    - "src/components/workspaces/components/WorkspaceCreator"
    - "src/components/org/CreateOrgDialog"
  flows:
    - onboarding-blank-workspace

- surface: threads
  paths:
    - "src/pages/threads/"
    - "src/pages/thread/"
  flows:
    - threads-list

- surface: admin-workspace-health
  paths:
    - "src/pages/admin/AdminWorkspaceHealth/"
    - "src/hooks/api/workspaceHealth/"
    - "src/services/api/workspaceHealth.ts"
