# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# New Pipeline wizard: selecting the Amazon Selling Partner source reveals a
# credentials card on the Details step (LWA client id, client secret + secret
# name, refresh token + secret name, marketplace, start date).
#
# Like the QuickBooks flow, this stops at the Details step and does NOT click
# Create — creating a pipeline writes a `.airway.yml` and there is no
# delete-file setup command, so a real create would not be idempotent across
# reruns.
#
# The two assertions worth having here are the ones that encode backend
# refusals, because they are what stop the wizard producing a config
# `build_sp_api` rejects at run time:
#   * marketplace is a SELECT (not free text), so a non-NA id cannot be typed
#     and turned into a 403 that reads like an auth failure;
#   * the start date is pre-filled rather than blank, since the field is
#     required and an empty one is refused.
#
# Requires the `warehouse` postgres destination in demo_project/config.yml
# (the wizard's destination step lists only airway-writable databases, and
# the demo's DuckDB `local` is not a valid ELT sink).

name: New Pipeline wizard shows Amazon Selling Partner credentials
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  - "goto:/ide"

cases:
  - name: selecting Amazon Selling Partner reveals the credentials card
    tags: [ide, pipelines]
    steps:
      - act: |
          Open the New Pipeline wizard from the IDE Files sidebar:
          1. Click [data-testid=new-object-button] (the + "New Object" button).
          2. In the dropdown, click [data-testid=new-object-pipeline].
          The "New pipeline" dialog opens on the Source step.
      - act: "Click the Amazon Selling Partner source card [data-testid=pipeline-source-sp_api]. The wizard advances to the Destination step."
      - act: "Click the destination database card [data-testid=pipeline-dest-warehouse]. The wizard advances to the Details step."
      - act: "Type 'sp_api_pipeline_test' into the pipeline name input (selector #pipeline-name)."
      - wait_for: "selector:#sp-api-refresh-token-name"
    expect:
      - assert: "selector #sp-api-client-id is visible"
      - assert: "selector #sp-api-client-secret is visible"
      - assert: "selector #sp-api-client-secret-name is visible"
      - assert: "selector #sp-api-refresh-token is visible"
      - assert: "selector #sp-api-refresh-token-name is visible"
      - assert: "selector #sp-api-marketplace is visible"
      - assert: "selector #sp-api-default-start is visible"
      # Pre-filled, not blank: the field is required and `build_sp_api` refuses
      # a config without it, so a blank default would hand every operator the
      # same avoidable failure. A controlled input sets the value PROPERTY, so
      # this needs `has a non-empty value` rather than `has attribute value=`.
      - assert: "selector #sp-api-default-start has a non-empty value"
      # Pre-selected too. The list is fetched, so a picker still showing the
      # placeholder means the request failed — which would otherwise look
      # exactly like an operator who has not chosen yet.
      - assert: "selector #sp-api-marketplace does not contain text \"Select a marketplace\""
      - judge: "the New Pipeline dialog's Details step shows an 'Amazon Selling Partner credentials' section with an LWA Client ID, a client secret and its secret-name field, a refresh token and its secret-name field, a Marketplace dropdown (not a free-text box), and a Start date that is already filled in rather than empty"
