# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Verify the threads list page renders, a thread can be opened from the
# list, and the thread detail page loads. Targets the "user wants to find
# a past conversation" path.
#
# **Why a chat-ask prelude.** A fresh `oxy start --local --enterprise`
# Postgres has zero threads, and `/threads` is empty until the user
# submits at least one question. Rather than add a new `seed_thread`
# fixture that calls into the API (extra surface area subject to the
# read-only-against-external-systems policy), the flow drives a small
# chat-ask interaction first — same surface as `chat-ask` but the goal
# here is just to put a row in the list, then navigate.
#
# Navigation note: shell v2 chrome is the left icon rail
# ([data-testid=shell-rail]) — submitting opens the thread in the right
# drawer, and /threads is reachable via [data-testid=rail-threads] or
# direct navigation.

name: threads list
target: threads

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  backend_mode: local
  # 1 chat submit + waits + drawer close + 1 navigate + 1 click + judge.
  # Pad for the initial chat-ask iteration plus the agentic analytics run
  # on a single question.
  max_steps: 25

setup:
  - "goto:/"

cases:
  - name: submit a question, navigate to /threads, open the seeded thread
    tags: [threads, regression]
    steps:
      # Canonical chat-prelude — byte-identical to chat-ask's step so
      # `cache_scope: shared` lets both flows reuse the same recording.
      # If you change this text, mirror it in chat-ask.flow.test.yml.
      - act: |
          Submit "What were the total weekly sales by store?" to the
          analytics agent on the home page. The demo project ships a single
          agent (`analytics`, analytics.agentic.yml) selected by default, so
          no agent-picker step is needed:
          1. browser_type into textarea[name=question]: "What were the total weekly sales by store?"
          2. browser_click [data-testid=chat-panel-submit-button].
          End the turn once the thread drawer ([data-testid=thread-drawer])
          opens on the right — the URL does not change.
        cache_scope: shared

      - wait_for: streaming_complete

      # The drawer is a modal sheet — close it before navigating so it
      # doesn't block clicks on the threads list.
      - act: |
          browser_press_key Escape to close the thread drawer
          ([data-testid=thread-drawer] disappears).

      - wait_for: "selector_hidden:[data-testid=thread-drawer]"

      - act: |
          browser_navigate to "/threads". The threads list page
          ([data-testid=threads-list-page]) loads with a paginated
          thread list; the icon rail stays on the left edge.

      - wait_for: "selector:[data-testid=thread-item]"

      - act: |
          browser_click [data-testid=thread-title] on the first row.
          URL changes to /threads/<id>; conversation history loads.

      - wait_for: network_idle

    expect:
      # No `[data-testid=thread-item]` assert — by `expect:` runtime the
      # flow has navigated from /threads (list) to /threads/<id> (detail).
      # The judge covers what matters: real conversation rendered.
      - judge: |
          The page is on a thread detail URL (/threads/<id>) with a past
          conversation visible (at least one user message + one agent
          response). The conversation is about weekly sales per store
          (the question we submitted in the prelude). No error banner.
