# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# New Pipeline wizard: selecting the QuickBooks Online source reveals a
# credentials card on the Details step (client id, realm id, client secret
# + secret name, refresh token + secret name, base url). The flow stops at
# the Details step and asserts the inputs render — it does NOT click Create,
# because creating a pipeline writes a `.airway.yml` (no delete-file setup
# command exists, so a real create wouldn't be idempotent across reruns).
#
# Requires the `warehouse` postgres destination in demo_project/config.yml
# (the wizard's destination step lists only airway-writable databases, and
# the demo's DuckDB `local` is not a valid ELT sink).

name: New Pipeline wizard shows QuickBooks credentials
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  - "goto:/ide"

cases:
  - name: selecting QuickBooks reveals the credentials card
    tags: [ide, pipelines]
    steps:
      - act: |
          Open the New Pipeline wizard from the IDE Files sidebar:
          1. Click [data-testid=new-object-button] (the + "New Object" button).
          2. In the dropdown, click [data-testid=new-object-pipeline].
          The "New pipeline" dialog opens on the Source step.
      - act: "Click the QuickBooks source card [data-testid=pipeline-source-quickbooks]. The wizard advances to the Destination step."
      - act: "Click the destination database card [data-testid=pipeline-dest-warehouse]. The wizard advances to the Details step."
      - act: "Type 'qb_pipeline_test' into the pipeline name input (selector #pipeline-name)."
      - wait_for: "selector:#qb-refresh-token-name"
    expect:
      - assert: "selector #qb-client-id is visible"
      - assert: "selector #qb-client-secret is visible"
      - assert: "selector #qb-client-secret-name is visible"
      - assert: "selector #qb-refresh-token-name is visible"
      - assert: "selector [data-testid=qb-connect-button] is visible"
      - judge: "the New Pipeline dialog's Details step shows a 'QuickBooks Online credentials' section with a Client ID, Client secret, secret-name fields, and a 'Connect with QuickBooks' button (the realm id and refresh token are captured by Connect, not typed)"
