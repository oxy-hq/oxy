# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Prove the monaco-yaml web worker actually boots in a browser.
#
# `ide-save` is the only IDE flow in CI and it opens `test.sql`, so nothing
# here has ever instantiated monaco-yaml. That worker is the most fragile
# thing in the editor's dependency graph: monaco-yaml pulls in
# monaco-worker-manager@2 (last published 2022, unmaintained), whose
# worker.js imports `monaco-editor/esm/vs/editor/editor.worker.js` — a path
# monaco 0.56 stopped exporting. It resolves only because of a
# `resolve.alias` in web-app/vite.config.ts anchored to that one specifier.
#
# A `yaml.worker-*.js` chunk in `dist/` proves the alias resolved at BUILD
# time. It does not prove the worker starts, connects, and answers — that is
# what this flow covers, and it is the gap #2965 had to leave open.
#
# The assertion is a YAML *syntax* error rather than a schema violation on
# purpose: syntax diagnostics are produced by the language service inside the
# worker from a local parse, so the flow cannot fail for a connectivity reason
# when the schema fetch (`enableSchemaRequest` in monacoConfig.ts, pointed at
# raw.githubusercontent.com) is slow or blocked.
#
# The target file matters, and not for the reason a first read suggests.
# Monaco is NOT limited to `FileType.DEFAULT`: `EditorPageWrapper` renders
# `customEditor ? customEditor : <FileEditor />`, so the App, Automation,
# Airway and AgenticAnalytics editors all mount Monaco unless they pass a
# custom editor. What decides it is VIEW STATE, not the extension —
# `FilesContext` defaults `filesSubViewMode` to `OBJECTS`, which
# AgenticAnalytics maps to Form mode, which passes a `customEditor`. That is
# why the first version of this flow opened `analytics.agentic.yml` and hung
# on `.monaco-editor` for 30s: the deep link was fine, the default view just
# renders a form.
#
# `.world-model.yml` is used because it needs no view-state coaxing (it falls
# through to `FileType.DEFAULT`) AND matches none of the `fileMatch` globs in
# monacoConfig.ts, so no schema is requested. That second property is
# load-bearing: yaml-language-server awaits schema resolution inside
# `doValidation`, so a schema fetch that HANGS — firewalled runner, slow CDN —
# suppresses the syntax marker too, and the flow would time out for a
# connectivity reason. `config.yml` has the first property but not the second.
# Caveat worth knowing: `.world-model.yml` is hidden from the file tree
# (`IGNORE_FILES_REGEX` in FilesSidebar/constants.ts skips dotfiles), so it is
# reachable by deep link only — which is what this flow uses.

name: IDE YAML diagnostics
target: ide

# NOT IN CI as of 2026-08-22 — it fails, and it is right to. Run against the
# real IDE it reaches `.monaco-editor`, the keystrokes land (the save button
# appears), and no marker ever arrives, because monaco-yaml's worker answers
# every request with `Missing requestHandler or method: doValidation` (also
# findLinks / getCodeAction / getFoldingRanges / findDocumentSymbols).
# Reproduced outside the flow with a standalone harness: `configureMonacoYaml`
# succeeds, `monaco.editor.getModelMarkers()` stays empty. So YAML in the IDE
# editor has no validation, folding, symbols, links or code actions.
#
# Wiring this into the `ide` bucket would make every Rust PR red for a reason
# that has nothing to do with the PR, so it stays out of
# `.github/workflows/agentic-tests.yaml` until the worker is fixed — the same
# `wip` convention `ide-compile-error` uses. Add `ide-yaml-diagnostics` back to
# the bucket's `flows` list in the same commit as the fix: this flow is the
# check that the fix worked.

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  # The flow never saves, so the file is not actually mutated — this is
  # belt-and-braces so a half-finished run cannot leave the demo project
  # dirty for the next flow in the bucket.
  - "restore_demo_file:.world-model.yml"
  # `LndvcmxkLW1vZGVsLnltbA==` is base64(".world-model.yml"). The IDE editor route is
  # /ide/files/<base64>, NOT /ide/<filename> — navigating directly opens the
  # editor without spending an LLM step on a file-tree click.
  - "goto:/ide/files/LndvcmxkLW1vZGVsLnltbA=="

cases:
  - name: a YAML syntax error raises a monaco-yaml marker
    tags: [ide, regression]
    steps:
      # The editor is a child route of /ide, so no Monaco exists until the file
      # route mounts. Without this gate the typing below goes nowhere and the
      # marker never appears — a worker failure and a focus failure would look
      # identical.
      - wait_for: "selector:.monaco-editor"

      - act: |
          Append a line of deliberately malformed YAML to the open file:
          1. browser_click selector ".monaco-editor" to focus. (The page has
             TWO Monaco surfaces — file editor on top, results panel below.
             `.first()` picks the file editor.)
          2. browser_press_key "Meta+End" then "Enter".
          3. browser_keyboard_type (NOT browser_type — Monaco's hidden
             textarea breaks selector-based focus) text
             "broken: [unclosed, sequence".

      # Typing dirties the file on the first keystroke, so `ide-save-button`
      # appearing proves the keystrokes actually landed. Without this gate a
      # lost focus and a dead worker both surface as the same 30s timeout on
      # `.squiggly-error` below — which is exactly the distinction this flow
      # exists to make. Same gate `ide-save` uses, and it costs no LLM call.
      - wait_for: "selector:[data-testid=ide-save-button]"

      # This wait IS the assertion. `.squiggly-error` is monaco's marker
      # decoration class; only the YAML language service running in the worker
      # can produce one for this file, so a worker that never starts — or
      # starts and cannot import `initialize` — times out here with a named
      # failure rather than a vague judge verdict.
      - wait_for: "selector:.squiggly-error"
    expect:
      - assert: "selector .squiggly-error is visible"
      - judge: "the editor shows an error indicator on the malformed YAML line, not a clean document"
