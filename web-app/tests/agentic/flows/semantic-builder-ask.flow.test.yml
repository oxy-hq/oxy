# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# End-to-end integration: the builder writes a new measure into the
# semantic layer, then we verify DIRECTLY in the IDE's view explorer that
# the measure is usable — it compiles to SQL and executes against the
# warehouse — instead of asking the analytics agent.
#
# Phase 1: From /ide, open the builder via Cmd+I and ask it to add a new
#   measure `high_fuel_price_revenue` (sum of Weekly_Sales filtered to
#   Fuel_Price > 3.5) to `sales_semantics/views/oxymart.view.yml`. Leave
#   auto-approve OFF and explicitly Accept the proposed edit — the toggle is
#   unreliable to flip on warm replay (it left the edit_file suspension
#   unresolved and the measure unwritten), whereas a gated Accept click is
#   deterministic — so the file reliably lands on disk.
#
# Phase 2: Open the oxymart view in the IDE's Explorer mode, select the new
#   measure in the Fields panel, and Run the query. The query compiles to
#   SQL and executes against the DuckDB warehouse; the execution-time
#   indicator (and a results table, not an error panel) proves the
#   builder-created measure is genuinely usable.
#
# Why verify in the IDE explorer rather than via the analytics agent: the
# agentic analytics agent is a HYBRID (semantic layer + raw-schema
# fallback). For a question it can answer from base columns it generates
# SQL directly and never touches the dedicated measure, so "did the agent
# use the new measure" runs only ~50–85% even when the question names the
# measure — that's the agent's nature, not a usability signal. The IDE view
# explorer compiles + runs the selected measure deterministically, which is
# exactly the "is this measure usable" check this flow exists for. The whole
# flow is deterministic (no LLM judge).
#
# Why /ide for Phase 1: the Cmd+I hotkey is registered at WorkspaceLayout
# level (App.tsx) but react-hotkeys-hook disables hotkeys while a form input
# is focused; the home page autofocuses the chat textarea and captures `i`.
# The /ide page has no autofocused input, so Meta+i fires reliably.
#
# `restore_demo_file:sales_semantics/views/oxymart.view.yml` reverts the
# view before each run so the measure doesn't compound across reruns.
#
# Preconditions:
#   * $ANTHROPIC_API_KEY in the runner's environment.
#   * Docker Desktop running. backend_mode: local — runner spawns
#     `oxy start --local --enterprise` from `demo_project/` itself.
#
# Cold cost: ~$0.30–0.60 (one builder agent run + IDE-driven steps; no
# analytics agent run and no LLM judge). Warm cost: ~$0.005.

name: builder adds measure, verify it is usable in the IDE
target: any

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  backend_mode: local
  # Cold builder run can iterate many times (lookup_schema, search_files,
  # read_file, validate_project, edit_file). Pad accordingly.
  max_steps: 40

setup:
  - "restore_demo_file:sales_semantics/views/oxymart.view.yml"
  - "goto:/ide"

cases:
  - name: builder adds high_fuel_price_revenue; the IDE view explorer runs it successfully
    tags: [builder, semantic, integration, critical]
    steps:
      # === Phase 1: Builder adds a measure to the semantic layer ===
      - act: |
          You are on /ide where Cmd+I opens the builder dialog. Open it and
          submit a build prompt. Do NOT touch the auto-approve toggle — leave
          it OFF; we approve the proposed edit explicitly below. (The
          auto-approve toggle is unreliable to flip on warm replay, which
          left the edit_file suspension unresolved and the measure unwritten;
          an explicit Accept click is deterministic.)

          1. browser_press_key "Meta+i". [data-testid=builder-dialog-root]
             becomes visible.
          2. browser_click [data-testid=builder-input-textarea] to focus.
          3. browser_keyboard_type (NOT browser_type) the user prompt as a
             plain-language request — the kind of thing a real user would
             write at a builder prompt, not a specification with disclaimers:

               "In the oxymart view, add a measure called high_fuel_price_revenue that sums Weekly_Sales for weeks when Fuel_Price is above 3.5."
          4. browser_press_key "Enter". URL changes to /threads/<id> and the
             builder run starts.

          Do NOT browser_snapshot mid-sequence — the snapshot summarizer
          sometimes reports the Radix-portal dialog as missing.

      # With auto-approve OFF the builder proposes the edit and SUSPENDS,
      # rendering a file-change diff with Accept/Reject buttons in the thread
      # (FileChangeDiff.tsx). Wait for the Accept button; 4-min timeout covers
      # the cold builder run (lookup_schema, search_files, validate_project,
      # edit_file) — it can run long when the machine is loaded; an isolated
      # CI runner is faster, but the headroom is cheap (a fast run hits the
      # Accept button well before the ceiling).
      - wait_for: "selector:[data-testid=file-change-accept];timeout_ms=240000"

      - act: |
          The builder proposed the measure edit (auto-approve is OFF).
          browser_click [data-testid=file-change-accept] to approve it. If the
          builder proposed more than one file edit, more than one Accept
          button may appear — click each [data-testid=file-change-accept]
          until none remain. Accepting resumes the pipeline and writes
          high_fuel_price_revenue into the view file.

      # The accept applies the edit: the suspension resolves and the measure
      # is written to the view file. Wait for the Accept button to disappear
      # — that confirms the edit landed — rather than for the whole builder
      # run to finish. The post-accept interpret/summarize turn can run long
      # and isn't needed here: the measure is already on disk once the
      # suspension resolves. (If the builder proposed more than one edit,
      # the act above accepts each, so this only fires once all are applied.)
      - wait_for: "selector_hidden:[data-testid=file-change-accept];timeout_ms=90000"

      # === Phase 2: Verify the measure is usable in the IDE view explorer ===
      # Atomic steps, each gated on a signal proving the previous action
      # landed. Warm replay fires recorded clicks back-to-back, faster than
      # the UI settles, so a compound "navigate + click + click" step races
      # an unsettled page (the run click fired while the Run button was still
      # disabled → no query → the execution-time wait timed out). One action
      # per step + a gate after each removes that race.

      - act: |
          browser_navigate
          "/ide/files/c2FsZXNfc2VtYW50aWNzL3ZpZXdzL294eW1hcnQudmlldy55bWw="
          — that path segment is base64 of
          `sales_semantics/views/oxymart.view.yml`, so this opens the oxymart
          view editor directly. Navigate by URL rather than clicking through
          the file tree (the multi-click tree expansion is timing-flaky on
          warm replay). Do NOT browser_snapshot before it settles.

      # The view opens in Editor (YAML) mode; the mode switcher (tabs
      # aria-labelled "Explorer view" / "Editor view") mounts with the view
      # editor. Gate on the Explorer tab so the click below can't race the
      # post-navigation mount.
      - wait_for: "selector:[aria-label='Explorer view'];timeout_ms=30000"

      - act: |
          browser_click `role=tab[name='Explorer view']` to switch the view
          editor into Explorer mode; the left Fields panel then lists the
          Dimensions and Measures sections.

      # The just-added measure renders as a clickable item in the Measures
      # section once the explorer loads the (freshly edited) view.
      - wait_for: "selector:[data-testid=semantic-field-measure-high_fuel_price_revenue];timeout_ms=30000"

      - act: |
          Add the measure to the query: if the "Measures" section is
          collapsed, click its "Measures" header first so the item is visible,
          then browser_click
          [data-testid=semantic-field-measure-high_fuel_price_revenue].

      # Selecting the measure marks its sidebar item active (data-active=true)
      # and enables the Run button — it is disabled until at least one field
      # is selected (canExecuteQuery). Gate on the active state so the Run
      # click below cannot fire while the button is still disabled: that was
      # the warm-replay race that left the query unrun and timed out the
      # execution-time wait.
      - wait_for: "selector:[data-testid=semantic-field-measure-high_fuel_price_revenue][data-active=true];timeout_ms=15000"

      - act: |
          browser_click [data-testid=semantic-run-query] (the Run-query play
          button) to compile the selected measure to SQL and execute it.

      # On success the execution-time indicator renders (the query compiled
      # to SQL and executed against DuckDB). On a compile/execution failure
      # the error panel ([data-testid=semantic-query-error]) renders instead
      # and this wait times out — which is the correct "not usable" failure.
      - wait_for: "selector:[data-testid=semantic-query-execution-time];timeout_ms=90000"

    expect:
      # DETERMINISTIC usability check — no LLM judgment. The builder-created
      # measure compiled to SQL and executed against the warehouse, so the
      # execution-time indicator rendered.
      - assert: 'selector [data-testid=semantic-query-execution-time] is visible'
      # And it did not error: the error panel replaces the results table on a
      # compile/execution failure, so it must be absent.
      - assert: 'selector [data-testid=semantic-query-error] is not visible'
      # The results table rendered (a result set came back, not an error).
      - assert: 'selector [data-testid=semantic-query-results] is visible'
