# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Ask a sales question via the universal "Ask Oxygen" dock and verify the
# analytics agent — `analytics` (analytics.agentic.yml), the demo project's
# sole agent since #2346 removed the classic `default.agent.yml` — returns a
# coherent, data-backed answer.
#
# The Ask dock ([data-testid=ask-dock]) is the apps-first ask surface: the
# top-bar "Ask Oxygen" button ([data-testid=ask-oxygen-button]) opens it, and
# submitting streams the answer inside the dock in place — the URL stays put.

name: chat ask returns an analytics answer
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 15

setup:
  - "goto:/"

cases:
  - name: ask a question and get an analytics answer in the dock
    tags: [chat, critical]
    steps:
      - act: |
          browser_click [data-testid=ask-oxygen-button] in the top bar. The
          right-side Ask dock ([data-testid=ask-dock]) opens with a ChatPanel
          composer inside.

      - wait_for: "selector:[data-testid=ask-dock]"

      - act: |
          Submit "What were the total weekly sales by store?" to the analytics
          agent via the Ask dock. The demo project ships a single agent
          (`analytics`, analytics.agentic.yml) selected by default, so no
          agent-picker step is needed:
          1. browser_type into the SCOPED selector
             `[data-testid=ask-dock] textarea[name=question]`:
             "What were the total weekly sales by store?"
             Scoped, not bare: this page renders TWO composers — the launcher's
             behind the dock and the dock's own — so a bare
             `textarea[name=question]` matches the one underneath, leaves the
             dock's box empty, and the submit button stays disabled
             (`ChatPanel/index.tsx` disables on `!message`). The click then
             lands on a dead button and nothing streams, which surfaces as
             "the previous act step probably never submitted".
          2. browser_click the SCOPED selector
             `[data-testid=ask-dock] [data-testid=chat-panel-submit-button]`.
             Scoped for the same reason as step 1 and it is the same two
             components: `AskForwardFallback` (launcher/index.tsx:105, the
             no-custom-apps branch the demo workspace takes) and
             `AskDock/DockComposer` both render `ChatPanel`, so the page carries
             TWO buttons with this testid as well as two textareas. A bare
             selector takes the first — the launcher's, underneath — and the
             click never reaches the dock.
          The dock switches to its thread view and the answer streams in place.

      - wait_for: streaming_complete

    expect:
      # The agentic analytics agent renders its result as reasoning-trace
      # steps + an interpreted answer inside the dock, not a classic
      # `execute_sql` artifact — so assert on the answer via the judge.
      # (streaming_complete already gates run completion.)
      - judge: |
          The Ask dock on the right shows the analytics agent's answer to the
          "total weekly sales by store" question — a coherent, data-backed
          result with per-store sales figures as a table, chart, or written
          summary. Fail if instead the dock shows an error banner, or the
          agentic run is suspended awaiting input on a clarifying question (a
          prompt back to the user, not an answer).
