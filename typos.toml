# configuration for https://github.com/crate-ci/typos

[default.extend-words]
consts = "consts"
delt = "delt"
AKS = "AKS"
# "PNGs" is flagged because typos sees "PN" as a fragment; it is valid English.
PN = "PN"
# "RTO" is the Recovery Time Objective acronym, not a typo.
RTO = "RTO"
# "YoY" is the year-over-year abbreviation used in column names / examples.
yoy = "yoy"
# "caf" is the truncated slugifier output for inputs like "Café" — non-ASCII
# is dropped, not romanised (see crates/shared/src/utils/slug.rs).
caf = "caf"
# SQL verb pluralisation in prose / comments — "INSERTs", "DELETEs",
# "UPDATEs", "SELECTs" are common when describing batched statements.
# typos sees the trailing `s` as suffix and clips it back to a
# 5-letter fragment.
INSER = "INSER"
inser = "inser"
DELET = "DELET"
delet = "delet"
UPDAT = "UPDAT"
updat = "updat"
SELEC = "SELEC"
selec = "selec"
# "mis-" prefix (mis-copy, mis-positions, mis-policied) is a valid
# English construction; typos clips the trailing `s` from
# `mis-copy` style strings into a `mis` token.
mis = "mis"
# "unparseable" — common technical English spelling (alongside
# "unparsable"). Both are correct.
unparseable = "unparseable"
# "HashiCorp" — vendor name (HashiCorp Vault, etc.). typos clips
# to `Hashi` because the bicaps fragment looks like a misspell.
Hashi = "Hashi"
# "SME" — Subject Matter Expert acronym used in engineering notes.
SME = "SME"
# `b"abd"` in fleet.rs constant-time-eq test: the bytes literal is
# *meant* to differ from `b"abc"` by exactly one byte.
abd = "abd"
# "OT" is the overtime abbreviation used across the world-model labor UI/docs
# (e.g. "OT hours", the `otHours` ribbon field). Both cases are listed so the
# fragment from camelCase identifiers (otHours) is accepted too.
OT = "OT"
ot = "ot"
# "ANDed" — past tense of the logical AND operator, common in SQL/filter prose.
# typos clips to `Ded` which it misreads as a fragment of "Dead".
ANDed = "ANDed"
anded = "anded"
Ded = "Ded"
# "nd" — short local binding for the per-entity `BfsNeighbor`/neighbor-data value
# in the world-model graph BFS (e.g. `let Some(nd) = neighbor_data.get(..)`).
# typos reads the 2-letter identifier as a misspelling of "and".
nd = "nd"
# "Nd" is the "N days" time-window shorthand in ClickHouse query examples
# (e.g. `WHERE ts >= now - Nd`); typos misreads the fragment as "And".
Nd = "Nd"
# "opps" — the `dim_opps` local binding for the per-dimension opportunity list
# in airlayer's metric-tree engine (`dim_opps.push(DimensionOpportunity { .. })`),
# quoted verbatim in the opportunity-sizing design doc. typos reads the
# identifier fragment as a misspelling of "oops".
opps = "opps"

[type.md]
extend-ignore-re = [
  "\\[[[:xdigit:]]{7}\\]\\(https://github.com/oxy-hq/oxygen(-internal)?/commit/[[:xdigit:]]{40}\\)",
]

[files]
# Rendered HTML briefings/reports under internal-docs are markup, not prose —
# CSS class names (e.g. `.ba`, `.ba-card`) trip the spell-checker. Skip them.
extend-exclude = [
  "CHANGELOG.md",
  "*/docker-entrypoints/*",
  "*/demo_project/**",
  "*/examples/**",
  "internal-docs/*.html",
]
