# yaml-language-server: $schema=https://raw.githubusercontent.com/oxy-hq/oxygen/refs/heads/main/json-schemas/config.json

# Standalone restaurant demo project.
#
# Deliberately isolated from `examples/`: the Playwright specs and
# `demo_project/` (the shipped onboarding template) do not point here, so this
# can be reshaped freely without breaking the fruit fixture everything else
# asserts against. See scripts/gen_restaurant_data.py for what the data is
# shaped to demonstrate.
#
# It is NOT isolated from CI any more. Two Rust test binaries read these files
# off disk and assert on the numbers they produce:
#
#   * crates/app/tests/platform/metric_tree_fit_panel.rs — runs the real scenario fit
#     against `.db/*.csv` through DuckDB, and pins values (3.886 guests per
#     server-day, 203.47 revenue) rather than only "the query ran".
#   * crates/semantic/tests/example_new_metric_tree.rs — asserts the shape of
#     the tree these views build.
#
# So reshaping the views or regenerating the data is a change to those tests
# too. That is the point — a fake executor answers whatever it is told, which
# is how two query-shape bugs in a row reached a user.

defaults:
  database: local

models:
  - vendor: anthropic
    name: claude-sonnet-4-6
    model_ref: claude-sonnet-4-6
    key_var: ANTHROPIC_API_KEY

databases:
  - name: local
    type: duckdb
    dataset: .db/

builder_agent:
  model: claude-sonnet-4-6

# Rollups are written as Parquet, which DuckDB autoloads an extension for —
# unavailable in network-restricted environments, where every rebuild fails on
# the heartbeat and buries real errors in the log. The fixture is 104,000
# checks (446,726 line items) and queries fine unaggregated, so the worker is
# off, as in demo_project.
pre_aggregations:
  refresh_worker:
    enabled: false
