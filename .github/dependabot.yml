version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # Its tag IS the Rust toolchain it installs, pinned to rust-toolchain.toml and
      # bumped with it by hand. Dependabot reads the tag as an action release:
      # #3590 moved it to 1.120.0, a Rust that does not exist, and every Rust job
      # failed at install.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: "cargo"
    directories: ["/"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    groups: # here until https://github.com/dependabot/dependabot-core/issues/1778 is solved
      prod-cargo-minor-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-cargo-minor-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-cargo-major-dependencies:
        dependency-type: "production"
        update-types:
          - "major"
      dev-cargo-major-dependencies:
        dependency-type: "development"
        update-types:
          - "major"
  - package-ecosystem: "npm"
    # sdk/typescript is intentionally excluded — it's released independently.
    directories:
      - "/"
      - "/web-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    ignore:
      # 7.90.0 throws in getDirtyFields when setValue(path, undefined, { shouldDirty })
      # clears an object that had a default value — what the agent form's remove /
      # "Use Defaults" buttons and the automation variables editor do. #3609 took it
      # and Vitest went red. Pinned to 7.89.0 in web-app/package.json; a later
      # release still gets proposed, and those Vitest cases are what vet it.
      - dependency-name: "react-hook-form"
        versions: ["7.90.0"]
    groups:
      prod-npm-minor-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-npm-minor-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-npm-major-dependencies:
        dependency-type: "production"
        update-types:
          - "major"
      dev-npm-major-dependencies:
        dependency-type: "development"
        update-types:
          - "major"
