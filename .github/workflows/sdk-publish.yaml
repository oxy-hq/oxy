# Publishes the @oxy-hq SDK packages to the public npm registry
# (registry.npmjs.org) using npm Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# Packages handled:
#   - @oxy-hq/sdk             (sdk/typescript)
#   - @oxy-hq/vite-plugin     (sdk/vite-plugin)
#   - @oxy-hq/create-oxy-app  (sdk/create-oxy-app)
#
# ------------------------------------------------------------------------------
# RELEASE MODEL — publish-only (main is PR-protected)
# ------------------------------------------------------------------------------
# `main` enforces "changes only through a pull request", so this workflow does
# NOT bump versions or push commits back. Each package is published at whatever
# version is committed in its package.json. To cut a release:
#   1. Bump the package's `version` in a normal PR and merge it.
#   2. Run this workflow (Actions → SDK Publish → Run workflow) for that
#      package (or "all"). It builds and publishes the committed version.
# npm refuses to publish over an existing version, so re-running without a bump
# fails loudly. Packages are versioned independently — there is no shared version.
#
# ------------------------------------------------------------------------------
# TRUSTED PUBLISHING (configured on npmjs.com, per package)
# ------------------------------------------------------------------------------
# Each package's Settings → "Trusted Publisher" → GitHub Actions:
#     Organization or user : oxy-hq
#     Repository           : oxy-internal
#     Workflow filename    : sdk-publish.yaml   (filename only, with extension)
#     Environment          : (leave blank)
#
# Notes:
#   - Requires npm CLI >= 11.5.1 and Node >= 22.14.0 (enforced below).
#   - npm publishes provenance attestations automatically under OIDC; no
#     --provenance flag and no NODE_AUTH_TOKEN are needed.
#   - pnpm publish does NOT yet support OIDC (pnpm/pnpm#9812), so the publish
#     step shells out to `npm publish` while build/install stay on pnpm.
# ------------------------------------------------------------------------------

name: SDK Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which SDK package to publish (or 'all'). Each is published at the version committed in its package.json."
        required: true
        type: choice
        default: all
        options:
          - all
          - "@oxy-hq/sdk"
          - "@oxy-hq/vite-plugin"
          - "@oxy-hq/create-oxy-app"

permissions:
  # id-token: write — mint the OIDC token npm exchanges for short-lived publish
  #                   credentials (trusted publishing). No NPM_TOKEN.
  # contents: write — create the lightweight release tag (refs/tags/...) via the
  #                   API. The workflow never pushes to main (PR-protected).
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  # Serialize publishes so two manual runs can't race on the registry or tags.
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node >= 22.14.0 is required for npm OIDC trusted publishing; 24.x
          # satisfies it. `registry-url` writes a project-local .npmrc pointing
          # at the public npm registry (the @oxy-hq scope resolves there by
          # default). No auth token is wired — OIDC supplies credentials.
          node-version: 24.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Pin to a known
        # compatible line regardless of the npm bundled with Node 24.x.
        run: npm install -g npm@latest

      - name: Install dependencies
        # Single workspace install — pnpm-workspace.yaml lists all three SDK
        # packages, so this resolves and links them in one pass.
        run: pnpm install --frozen-lockfile

      - name: Publish selected packages
        env:
          # No auth token: npm exchanges the GitHub OIDC id-token (id-token:
          # write above) for short-lived publish credentials at publish time.
          # GH_TOKEN is used only to create the release tag via the API.
          GH_TOKEN: ${{ github.token }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          # Map of "package npm name" -> "workspace directory".
          declare -A PKG_DIRS=(
            ["@oxy-hq/sdk"]="sdk/typescript"
            ["@oxy-hq/vite-plugin"]="sdk/vite-plugin"
            ["@oxy-hq/create-oxy-app"]="sdk/create-oxy-app"
          )

          if [[ "${INPUT_PACKAGE}" == "all" ]]; then
            SELECTED=("@oxy-hq/sdk" "@oxy-hq/vite-plugin" "@oxy-hq/create-oxy-app")
          else
            SELECTED=("${INPUT_PACKAGE}")
          fi

          for pkg in "${SELECTED[@]}"; do
            dir="${PKG_DIRS[$pkg]}"
            version="$(node -p "require('./${dir}/package.json').version")"
            echo "::group::Publish ${pkg}@${version} (${dir})"

            # Build (tsdown) so the dist/ files referenced by main/module/
            # types/bin exist, then publish via `npm` (NOT pnpm — only npm
            # performs the OIDC token exchange). Provenance is automatic.
            # npm refuses to publish over an existing version, which is the
            # guard against re-running a stale publish.
            (cd "${dir}" && pnpm build)
            (cd "${dir}" && npm publish --access public)

            # Lightweight release tag at the published commit (e.g. sdk/v2.0.1).
            # Created via the API since main is PR-protected. Non-fatal: the
            # publish is what matters, and the tag may already exist on a retry.
            tag="${pkg#@oxy-hq/}/v${version}"
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                 -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "Tagged ${tag}"
            else
              echo "::warning::could not create tag ${tag} (already exists or tag protection)"
            fi

            echo "::endgroup::"
          done
