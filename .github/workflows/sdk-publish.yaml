# Publishes the @oxy-hq SDK packages to the public npm registry
# (registry.npmjs.org) using npm Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# Packages handled:
#   - @oxy-hq/sdk             (sdk/typescript)
#   - @oxy-hq/vite-plugin     (sdk/vite-plugin)
#   - @oxy-hq/create-oxy-app  (sdk/create-oxy-app)
#
# ------------------------------------------------------------------------------
# ONE-TIME SETUP ON npmjs.com (per package, already-published names required)
# ------------------------------------------------------------------------------
# Trusted publishing is configured per package on npmjs.com → the package's
# Settings → "Trusted Publisher" → GitHub Actions, with:
#     Organization or user : oxy-hq
#     Repository           : oxy-internal
#     Workflow filename    : sdk-publish.yaml   (filename only, with extension)
#     Environment          : (leave blank)
# Do this for @oxy-hq/sdk, @oxy-hq/vite-plugin, and @oxy-hq/create-oxy-app.
# All three were seeded with an initial manual publish, so the package pages
# exist and the Trusted Publisher form is available.
#
# Notes:
#   - Requires npm CLI >= 11.5.1 and Node >= 22.14.0 (enforced below).
#   - npm publishes provenance attestations automatically under OIDC; no
#     --provenance flag and no NODE_AUTH_TOKEN are needed.
#   - pnpm publish does NOT yet support OIDC (pnpm/pnpm#9812), so the publish
#     step shells out to `npm publish` while build/install stay on pnpm.
# ------------------------------------------------------------------------------

name: SDK Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which SDK package to publish (or 'all')"
        required: true
        type: choice
        default: all
        options:
          - all
          - "@oxy-hq/sdk"
          - "@oxy-hq/vite-plugin"
          - "@oxy-hq/create-oxy-app"
      version:
        description: "Semver to publish (e.g. 2.0.1). Applied to every selected package."
        required: true
        type: string

permissions:
  # contents: write — needed to push the version-bump commit and the release tag
  #                   back to the default branch.
  # id-token: write — needed to mint the OIDC token npm exchanges for short-lived
  #                   publish credentials (trusted publishing). No NPM_TOKEN.
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  # Serialize all publishes so two manual runs cannot race on the version-bump
  # commit + tag push.
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + persisted credentials so the post-publish commit can
          # be pushed back to the default branch.
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node >= 22.14.0 is required for npm OIDC trusted publishing; 24.x
          # satisfies it. `registry-url` writes a project-local .npmrc pointing
          # at the public npm registry (the @oxy-hq scope resolves there by
          # default). No auth token is wired — OIDC supplies credentials.
          node-version: 24.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Pin to a known
        # compatible line regardless of the npm bundled with Node 24.x.
        run: npm install -g npm@latest

      - name: Configure git author for version-bump commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        # Single workspace install — pnpm-workspace.yaml lists all three SDK
        # packages, so this resolves and links them in one pass.
        run: pnpm install --frozen-lockfile

      - name: Publish selected packages
        env:
          # No auth token: npm exchanges the GitHub OIDC id-token (id-token:
          # write above) for short-lived publish credentials at publish time.
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Map of "package npm name" -> "workspace directory".
          declare -A PKG_DIRS=(
            ["@oxy-hq/sdk"]="sdk/typescript"
            ["@oxy-hq/vite-plugin"]="sdk/vite-plugin"
            ["@oxy-hq/create-oxy-app"]="sdk/create-oxy-app"
          )

          if [[ "${INPUT_PACKAGE}" == "all" ]]; then
            SELECTED=("@oxy-hq/sdk" "@oxy-hq/vite-plugin" "@oxy-hq/create-oxy-app")
          else
            SELECTED=("${INPUT_PACKAGE}")
          fi

          # Track which packages actually got bumped so we know what to commit.
          BUMPED=()

          for pkg in "${SELECTED[@]}"; do
            dir="${PKG_DIRS[$pkg]}"
            echo "::group::Publish ${pkg} (${dir})"

            current="$(node -p "require('./${dir}/package.json').version")"
            echo "Current version: ${current}"
            echo "Requested version: ${INPUT_VERSION}"

            # Idempotency guard: if the package.json is already at the target
            # version (e.g. a previous run partially succeeded), don't bump or
            # re-commit — but still attempt publish so we can recover from a
            # failure between bump and publish. `npm publish` will exit
            # non-zero with a clear "cannot publish over previously published
            # version" message if the registry already has this version, which
            # is the correct retry behavior.
            if [[ "${current}" != "${INPUT_VERSION}" ]]; then
              (cd "${dir}" && pnpm version "${INPUT_VERSION}" --no-git-tag-version)
              BUMPED+=("${dir}/package.json")
            else
              echo "Version already matches; skipping bump."
            fi

            # Build (every package's build script is `tsdown`; required so the
            # `dist/` files referenced by main/module/types/bin actually exist).
            (cd "${dir}" && pnpm build)

            # Publish via `npm` (NOT pnpm): only the npm CLI performs the OIDC
            # token exchange for trusted publishing. Provenance attestations are
            # generated automatically under OIDC. `--access public` is a
            # belt-and-suspenders alongside publishConfig.access.
            (cd "${dir}" && npm publish --access public)

            echo "::endgroup::"
          done

          # Expose bumped paths to subsequent steps.
          {
            echo "bumped_files<<EOF"
            printf '%s\n' "${BUMPED[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
        id: publish

      - name: Commit + tag + push version bump
        if: success() && steps.publish.outputs.bumped_files != ''
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          BUMPED_FILES: ${{ steps.publish.outputs.bumped_files }}
        run: |
          set -euo pipefail

          # Stage every package.json that we actually changed.
          while IFS= read -r f; do
            [[ -n "${f}" ]] || continue
            git add "${f}"
          done <<< "${BUMPED_FILES}"

          # Nothing to commit — possible if every selected package was already
          # at the requested version. The publish step above may still have
          # succeeded as a retry; nothing else to do here.
          if git diff --cached --quiet; then
            echo "No package.json changes to commit."
            exit 0
          fi

          if [[ "${INPUT_PACKAGE}" == "all" ]]; then
            commit_msg="chore(sdk): publish all @oxy-hq SDK packages @ ${INPUT_VERSION} [skip ci]"
            tag="sdk/v${INPUT_VERSION}"
          else
            # Short tag for single-package publishes: drop the @oxy-hq/ prefix.
            short_name="${INPUT_PACKAGE#@oxy-hq/}"
            commit_msg="chore(sdk): publish ${INPUT_PACKAGE}@${INPUT_VERSION} [skip ci]"
            tag="${short_name}/v${INPUT_VERSION}"
          fi

          git commit -m "${commit_msg}"

          # Tag the commit so we have a recoverable marker per release.
          # `-f` would overwrite an existing tag, which we deliberately don't
          # want — fail loudly instead so the operator can pick a new version.
          git tag "${tag}"

          # Push to the branch that triggered the workflow (default branch
          # when run from workflow_dispatch on main).
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${tag}"
