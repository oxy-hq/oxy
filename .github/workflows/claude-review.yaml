name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**.rs"
      - "**.ts"
      - "**.tsx"
      - "**.css"
      - "**.js"
      - "**.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: ${{ github.event.pull_request.draft == false && github.repository ==
      'oxy-hq/oxygen-internal' && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    # Agent-driven PR review; cap the LLM loop so a stuck turn can't run away.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Post one summary via `gh pr comment` with:
            - one-line verdict: `LGTM` / `LGTM with nits` / `Needs changes` / `Blocking`
            - concise bullets with file:line references
            - for each finding: why it matters + concrete fix suggestion

            If no actionable issues remain, post `No actionable issues found`.

            Do not post inline review comments.
            Only post findings you can defend from the diff and existing repo guidance.

            Wrap issue/PR refs, `@mentions`, and SHAs in backticks
            (e.g. `#1234`, `oxy-hq/oxy-internal#1234`) — bare refs create
            noisy cross-links.

          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
