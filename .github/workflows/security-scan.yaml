name: Security Scan

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  push:
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday at 2am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  vulnerability-scan:
    name: Trivy Dependency Vulnerability Scan
    if: |
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
      (github.repository == 'oxy-hq/oxygen' ||
       (github.repository == 'oxy-hq/oxygen-internal' && github.event_name == 'pull_request'))
    runs-on: ubuntu-latest
    # Trivy fs scan of the repo; a stuck DB download shouldn't bill > 20m.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: ${{ github.repository == 'oxy-hq/oxygen' && 'sarif' || 'table' }}
          output: ${{ github.repository == 'oxy-hq/oxygen' && 'trivy-vuln-results.sarif'
            || 'trivy-vuln-results.txt' }}

      - name: Publish vulnerability results to workflow summary
        if: github.repository != 'oxy-hq/oxygen'
        run: |
          if [[ -s trivy-vuln-results.txt ]]; then
            {
              echo "### Dependency Vulnerability Scan"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-vuln-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload vulnerability results to GitHub Security tab
        if: github.repository == 'oxy-hq/oxygen'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-vuln-results.sarif
          category: trivy-vulnerability

  secret-scan:
    name: Trivy Secret Scan
    if: |
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
      (github.repository == 'oxy-hq/oxygen' ||
       (github.repository == 'oxy-hq/oxygen-internal' && github.event_name == 'pull_request'))
    runs-on: ubuntu-latest
    # Secret scan of the tree; bounded well under 15m.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          # localhost+2-key.pem is a mkcert local-dev TLS cert (not a real secret).
          # .env.example files contain placeholder values, not real credentials.
          skip-files: "localhost+2-key.pem,localhost+2.pem,**/.env.example"
          trivyignores: .trivyignore.yaml
          format: ${{ github.repository == 'oxy-hq/oxygen' && 'sarif' || 'table' }}
          output: ${{ github.repository == 'oxy-hq/oxygen' && 'trivy-secret-results.sarif'
            || 'trivy-secret-results.txt' }}

      - name: Publish secret scan results to workflow summary
        if: github.repository != 'oxy-hq/oxygen' && always()
        run: |
          if [[ -s trivy-secret-results.txt ]]; then
            {
              echo "### Secret Scan"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-secret-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### Secret Scan" >> $GITHUB_STEP_SUMMARY
            echo "No secrets detected." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload secret scan results to GitHub Security tab
        if: github.repository == 'oxy-hq/oxygen'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-secret-results.sarif
          category: trivy-secret

  cargo-deny:
    name: cargo-deny (advisories / bans / sources)
    if: |
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
      (github.repository == 'oxy-hq/oxygen' ||
       (github.repository == 'oxy-hq/oxygen-internal' && github.event_name == 'pull_request'))
    runs-on: ubuntu-latest
    # Reads Cargo.lock + the RustSec advisory DB; no crate compilation. Bounded < 15m.
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Fetch-only: this token just lets cargo read private git deps.
          permission-contents: read
          repositories: |
            airlayer
            airform
            airway-internal
            snowflake-rs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `cargo deny check` runs `cargo metadata`, which resolves the private
      # oxy-hq/* git deps (airway, airform, airlayer, snowflake-rs). Without gh
      # auth the fetch dies with "could not read Username for github.com".
      # Mirror the cargo job: gh auth via the App token; `git-fetch-with-cli`
      # (.cargo/config.toml) then lets cargo shell out to an authenticated git.
      - name: Authenticate gh for private cargo git deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "$GH_APP_TOKEN" | gh auth login --with-token
          gh auth setup-git

      - name: Install cargo-deny
        # SHA-pinned prebuilt-binary installer (no cargo build).
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-deny

      # NON-BLOCKING for now (`continue-on-error`). `licenses` is omitted from the
      # enforced set. advisories/bans/sources run for visibility — the advisories
      # check may surface additional unfixed transitive RUSTSEC entries on its
      # first real run; triage each (upgrade, or add a justified ignore to
      # deny.toml), then drop `continue-on-error` to make this a hard gate.
      - name: cargo deny check
        continue-on-error: true
        run: cargo deny check advisories bans sources
