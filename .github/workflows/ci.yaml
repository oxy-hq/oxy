name: CI check

on:
  pull_request:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - trigger-ci-workflow
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  workflow_dispatch:
    inputs:
      agentic_only:
        description: "Skip non-agentic jobs (fmt-web, build-web, smoke, e2e, cargo clippy/nextest) so the agentic-tests matrix runs against just a freshly-built binary. Use this for fast iteration on browser-test selectors."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug
  # Incremental compilation only helps warm local rebuilds. In CI it adds
  # bookkeeping overhead and bloats `target/incremental`, which the rust-cache
  # action strips before saving anyway — so we pay to produce artifacts that get
  # thrown away and inflate cache size. Force it off (overrides the global
  # `incremental = true` in .cargo/config.toml, which is there for local dev).
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changesets:
    if: |
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore: release')) &&
      (github.event_name != 'pull_request' || (!startsWith(github.head_ref,
        'release/') && !github.event.pull_request.draft))
    uses: ./.github/workflows/changesets.yaml
    name: Changesets

  fmt-web:
    name: Format web
    needs: [changesets]
    concurrency:
      group: fmt-web-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: inputs.agentic_only != true && needs.changesets.outputs.web-app == 'true'
    runs-on:
      ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # Install + lint-staged on the diff runs in ~2m warm; 15m covers a cold
    # pnpm store with generous headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: 26
          cache: "pnpm"

      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run lint-staged
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm lint-staged --diff="origin/${{ github.base_ref }}...origin/${{ github.head_ref }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            pnpm lint-staged --diff="${{ github.event.before }}...${{ github.event.after }}"
          fi

  build-web:
    name: Build web
    needs: [changesets]
    concurrency:
      group: build-web-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: inputs.agentic_only != true && needs.changesets.outputs.web-app == 'true'
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # `pnpm build` (turbo) runs in well under 10m; 25m absorbs a cold cache /
    # full TS rebuild while still bounding a hung Vite/tsc process.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        id: setup-node
        with:
          node-version: 26
          cache: "pnpm"

      # Cache TypeScript build info for incremental compilation
      # Key on tsconfig only — tsbuildinfo handles incremental source changes internally
      - name: Cache TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            web-app/tsconfig.app.tsbuildinfo
            web-app/tsconfig.node.tsbuildinfo
          key: typescript-${{ runner.os }}-${{ hashFiles('web-app/tsconfig*.json') }}
          restore-keys: |
            typescript-${{ runner.os }}-

      # Cache Vite pre-bundled deps (only invalidates when dependencies change, not source)
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            web-app/node_modules/.vite
            web-app/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml',
            'web-app/vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-

      # Cache Turbo for monorepo builds
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies & Build web-app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Enable Turbo remote caching (optional - configure if using Turbo remote cache)
          # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          # TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          # Install with frozen lockfile for reproducibility
          pnpm install --frozen-lockfile --prefer-offline
          # Build using Turbo for better caching
          pnpm build

  vitest:
    name: Web unit tests (Vitest)
    needs: [changesets]
    concurrency:
      group: vitest-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Own job, off the critical path (nothing `needs:` it). Gated on the web-app
    # changeset like fmt-web/build-web.
    if: inputs.agentic_only != true && needs.changesets.outputs.web-app == 'true'
    runs-on:
      ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # The Vitest unit suite runs in ~1-2m warm; 15m covers a cold pnpm store.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      # `test:unit` is `vitest run` (non-watch). Invoked directly via the pnpm
      # workspace filter — NOT wired as a turbo task (turbo.json is owned outside
      # this change-scope), so it runs standalone.
      # NON-BLOCKING: this suite was never gated before and carries pre-existing
      # failures across areas untouched by this change (billing / database /
      # context-graph / metric-tree). It runs for visibility; drop
      # `continue-on-error` to enforce once a dedicated pass greens the suite.
      - name: Run Vitest unit suite
        continue-on-error: true
        run: pnpm --filter oxy-web run test:unit

  cargo-fmt:
    name: Format cargo (rustfmt --check)
    needs: [changesets]
    concurrency:
      group: cargo-fmt-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Own quick job (not folded into the heavy check/test matrix) so a formatting
    # failure gives a fast, isolated signal and never masks the clippy/nextest run.
    if: |
      inputs.agentic_only != true &&
      needs.changesets.outputs.oxy == 'true' &&
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore: release')) &&
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/'))
    runs-on:
      ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # rustfmt --check on the whole workspace is seconds; 10m is pure hang insurance.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prep Rust (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  cargo-check-and-test:
    concurrency:
      group: cargo-check-and-test-${{ matrix.task }}-${{
        github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: [changesets]
    # In agentic_only mode the agentic-tests matrix needs the binary
    # this job produces, so force it to run even if
    # `needs.changesets.outputs.oxy` is false (a no-Rust PR can still
    # iterate on browser tests).
    if: inputs.agentic_only == true || needs.changesets.outputs.oxy == 'true'
    name: Format cargo, check & test (${{ matrix.task }})
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # The 5h CI runaway that motivated these guardrails happened here: with no
    # cap, a hung cargo/nextest process billed the runner until manually
    # cancelled. Warm cache is ~3m (check) / ~14m (test); a cold full
    # workspace compile + nextest tops out around ~40m, so 60m leaves headroom
    # for a worst-case cold build while killing a true hang within the hour.
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"
      # Fast CI builds: omit debug info entirely (this replaces the old `ci`
      # cargo profile's `debug = false`). Local dev keeps full debug via the
      # default dev profile — this override only applies in CI.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Restore the old `ci` profile's `strip = true`: shrinks the uploaded
      # `oxy-binary-ci` artifact and cuts link memory. Trade-off: CI panic
      # backtraces lose symbol names; drop this var if you need them while
      # debugging a flaky test.
      CARGO_PROFILE_DEV_STRIP: "symbols"
    strategy:
      fail-fast: true
      matrix:
        task: [check, test]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Free disk space
        if: matrix.task == 'test' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Fetch-only: this token just lets cargo read private git deps.
          # Scope to read-only contents so a leaked token can't push.
          permission-contents: read
          repositories: |
            airlayer
            airform
            airway-internal
            snowflake-rs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        if: runner.os == 'Linux'
        with:
          make-default: true

      - name: Prep Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: nextest
      # Private cargo git deps live under github.com/oxy-hq/* (airway,
      # airform, airlayer, snowflake-rs). The default checkout token
      # only auths THIS repo, so a fresh `rev` bump forces an
      # unauthenticated fetch that fails with "revision not found".
      # `git-fetch-with-cli` is on (.cargo/config.toml), so cargo shells
      # out to git, which uses gh as its credential helper — no token
      # baked into a URL rewrite. This mirrors the local flow exactly:
      # `gh auth login` + `gh auth setup-git`, then cargo fetches private
      # deps for free. --with-token stores the app token in gh's config
      # so the helper resolves it on later cargo steps without re-passing
      # it. Must run before any cargo step.
      - name: Authenticate gh for private cargo git deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "$GH_APP_TOKEN" | gh auth login --with-token
          gh auth setup-git
      - name: Prep cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: ${{ matrix.task }}
      # protobuf is required by lance https://github.com/lancedb/lance/issues/3073
      # Use apt instead of arduino/setup-protoc to avoid GitHub release rate limits / outages.
      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      # `cargo build` embeds the web-app dist into the oxy binary via
      # `include_dir!` in crates/app/src/cli/commands/serve.rs. The dist
      # path is a committed symlink: `crates/app/dist -> ../../web-app/dist`.
      # If `web-app/dist` is empty when cargo runs, the binary serves 404
      # on `/` — every Playwright/agentic flow then fails because the
      # frontend never loads. Build the web-app first so the symlink
      # resolves to populated content. Only matters for the `test` task
      # (which uploads the binary used by smoke + agentic jobs); `check`
      # is clippy and doesn't read dist content.
      - name: Setup pnpm
        if: matrix.task == 'test'
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false
      - name: Setup Node.js
        if: matrix.task == 'test'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - name: Build web-app dist (embedded into oxy binary)
        if: matrix.task == 'test'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          # Bundle only (skip `tsc -b`): the cargo build just needs the `dist/`
          # bytes for the `include_dir!` embed. Typechecking is already covered
          # in parallel by the `build-web` job (full `pnpm build`) and `lint:ts`,
          # so running `tsc -b` here too would duplicate the slowest part of the
          # web build on this job's critical path for no added signal.
          pnpm --filter oxy-web exec vite build

      - name: Run task
        env:
          OXY_DATABASE_URL: "postgresql://admin:password@localhost:5432/default"
          OXY_BIN: "${{ github.workspace }}/target/debug/oxy"
          AGENTIC_ONLY: ${{ inputs.agentic_only }}
        run: |
          if [[ "${{ matrix.task }}" == "check" ]]; then
            if [[ "$AGENTIC_ONLY" == "true" ]]; then
              echo "agentic_only mode: skipping clippy"
              exit 0
            fi
            # Dropped `--fix`: in CI the rewrites are never committed, so it was
            # pure wasted analysis+rewrite work. Matches the documented command
            # in CLAUDE.md. Kept advisory (no `-- -D warnings`): the workspace
            # tree is not yet warning-clean (pre-existing large_enum_variant /
            # type_complexity / should_implement_trait lints), and `check` runs
            # fail-fast, so enforcing now would block every PR. Flip to
            # `-- -D warnings` in a dedicated PR after a warning-cleanup pass.
            cargo clippy --workspace
            # Gate the feature-off build: the custom-app-functions (V8) feature is
            # compiled out by the `cf`/`bf`/`rf` aliases in .cargo/config.toml (`cf` is
            # this exact command), and an ungated `use` of a gated symbol only breaks
            # for whoever runs them — which is how the seam-trait regression this guards
            # against reached main. `clippy` (not `check`) so the workspace-member
            # fingerprints from the line above are reused; the check pass runs first, so
            # an E0433 fails it identically.
            cargo clippy --no-default-features -p oxy-app
          elif [[ "${{ matrix.task }}" == "test" ]]; then
            touch examples/bigquery-sample.key
            echo $BIGQUERY_SAMPLE_KEY > examples/bigquery-sample.key

            cargo build

            if [[ "$AGENTIC_ONLY" == "true" ]]; then
              echo "agentic_only mode: skipping migrate, nextest, gen-config-schema"
              exit 0
            fi

            ./target/debug/oxy migrate

            # Run tests (no coverage instrumentation)
            cargo nextest run --workspace --no-fail-fast

            ./target/debug/oxy gen-config-schema --check
          fi

      - name: Upload oxy binary artifact
        if: matrix.task == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oxy-binary-ci
          path: target/debug/oxy
          retention-days: 1

  smoke-test-enterprise:
    name: Smoke test (oxy start --enterprise)
    needs: [changesets, cargo-check-and-test]
    concurrency:
      group:
        smoke-test-enterprise-${{ github.event.pull_request.number || github.ref
        }}
      cancel-in-progress: true
    if: false # temporarily disabled
    runs-on: warp-ubuntu-latest-arm64-4x
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"
      OXY_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gacts/install-hurl@ab6d0234456944b022ef7d1f594845af9561357d # v1

      - name: Download oxy binary
        uses: ./.github/actions/download-oxy-binary

      - name: Start oxy
        working-directory: examples
        run: |
          oxy start --enterprise --clean &
          echo "OXY_PID=$!" >> $GITHUB_ENV
          # Wait for server (max 10 min)
          for i in {1..120}; do
            curl -sf --max-time 10 http://localhost:3000/api/health > /dev/null && break
            [ $i -eq 120 ] && { docker ps -a; docker logs oxy-postgres 2>&1 | tail -50; exit 1; }
            sleep 5
          done

      - name: Verify containers
        run: |
          for c in oxy-postgres; do
            docker ps --format "{{.Names}}" | grep -q "^${c}$" || { echo "::error::$c not running"; exit 1; }
          done

      - name: Smoke test - CLI
        working-directory: examples
        run: |
          oxy status
          oxy sync -o
          oxy build
          oxy validate
          oxy run data_fruit/example_food_calories.sql

      - name: Smoke test - HTTP (Hurl)
        run: |
          set -o pipefail
          echo '## Smoke Test Results' >> $GITHUB_STEP_SUMMARY
          hurl --test tests/smoke/smoke.hurl 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Test restart (data persistence)
        working-directory: examples
        run: |
          kill -TERM $OXY_PID 2>/dev/null || true
          for i in {1..30}; do kill -0 $OXY_PID 2>/dev/null || break; sleep 1; done
          sleep 2
          docker volume ls | grep -q oxy || { echo "::error::Volumes not persisted"; exit 1; }
          oxy start --enterprise &
          echo "OXY_PID=$!" >> $GITHUB_ENV
          for i in {1..60}; do
            curl -sf --max-time 10 http://localhost:3000/api/health > /dev/null && break
            [ $i -eq 60 ] && { docker ps -a; exit 1; }
            sleep 5
          done

      - name: Verify restart
        run: |
          for c in oxy-postgres; do
            docker ps --format "{{.Names}}" | grep -q "^${c}$" || { echo "::error::$c not running after restart"; exit 1; }
          done
          set -o pipefail
          hurl --test tests/smoke/smoke.hurl 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          kill -TERM $OXY_PID 2>/dev/null || true; sleep 3
          docker rm -f oxy-postgres 2>/dev/null || true

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: [changesets, cargo-check-and-test]
    # 💰 COST SAVING: Only run on approved PRs, pushes to oxy-hq/oxygen main, or manual trigger
    if: false # temporarily disabled
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # Consistency tests + Playwright (the run step is itself capped at 20m).
    # 45m bounds the whole job, including backend boot, if a step wedges.
    timeout-minutes: 45
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      OXY_STATE_DIR: ${{ github.workspace }}/examples
      OXY_DATABASE_URL: postgresql://admin:password@localhost:5432/default
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false

      - name: Download oxy binary
        uses: ./.github/actions/download-oxy-binary

      - name: Set up web-app test environment
        uses: ./.github/actions/setup-web-app-test-env

      # Cache Turbo for monorepo builds
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Setup BigQuery credentials if needed
      - name: Setup BigQuery credentials
        if: env.BIGQUERY_SAMPLE_KEY
        run: |
          touch examples/bigquery-sample.key
          echo "$BIGQUERY_SAMPLE_KEY" > examples/bigquery-sample.key

      # Run consistency tests using pre-built binary
      - name: Run consistency tests
        working-directory: demo_project
        run: |
          echo "Running consistency tests for default.agent.yml..."
          oxy sync -o
          oxy build
          oxy test default.agent.yml \
            --format json \
            --min-accuracy 0.8 \
            --threshold-mode average \
            | tee consistency-test-results.json

          echo "Consistency tests completed successfully!"

      - name: Upload consistency test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: consistency-test-results
          path: demo_project/consistency-test-results.json
          retention-days: 1

      - name: Show consistency test summary
        if: always()
        run: |
          if [ -f demo_project/consistency-test-results.json ]; then
            echo "=== Consistency Test Results ==="
            echo ""
            cat demo_project/consistency-test-results.json
            echo ""
            echo "Full results available in artifacts: consistency-test-results"
          else
            echo "No consistency test results file found"
          fi

      # Start backend server in background
      - name: Start Oxy backend server
        working-directory: examples
        run: |
          # Using pre-built binary - no compilation needed!
          nohup oxy serve > ../oxy-server.log 2>&1 &
          echo $! > /tmp/oxy-server.pid
          echo "Backend server started with PID: $(cat /tmp/oxy-server.pid)"

      # Wait for backend to be ready
      - name: Wait for backend server
        id: wait-backend
        run: |
          echo "Waiting for backend server to be ready..."
          timeout 10 bash -c 'until curl -k -s http://localhost:3000/api/health > /dev/null 2>&1; do echo "Waiting for health endpoint..."; sleep 2; done'
          echo "Backend health endpoint is responding!"

          # Give the backend additional time to scan and load apps from the examples directory
          echo "Waiting for backend to initialize apps..."
          sleep 10

          echo "Backend server should now be fully ready!"

      - name: Show backend server logs if wait failed
        if: steps.wait-backend.outcome == 'failure'
        run: |
          echo "=== Backend Server Logs (from wait failure) ==="
          if [ -f oxy-server.log ]; then
            tail -n 200 oxy-server.log || true
          else
            echo "No server logs found at oxy-server.log"
            ls -la || true
          fi

      # Run E2E tests
      - name: Run Playwright tests
        id: run-playwright
        timeout-minutes: 20
        env:
          PLAYWRIGHT_WORKERS: 2
        run: |
          cd web-app
          pnpm test:e2e

      # Upload test results and traces
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: web-app/playwright-report/
          retention-days: 1

      - name: Upload test results with traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-results
          path: web-app/test-results/
          retention-days: 1

      - name: Show trace instructions
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📹 Test traces, screenshots, and videos have been captured!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "To view the test traces:"
          echo "  1. Download the 'playwright-results' artifact from this workflow run"
          echo "  2. Extract the zip file"
          echo "  3. Run: npx playwright show-trace path/to/trace.zip"
          echo ""
          echo "The trace viewer will open in your browser with:"
          echo "  • Full test execution timeline"
          echo "  • Screenshots at each step"
          echo "  • Network requests/responses"
          echo "  • Console logs"
          echo "  • DOM snapshots"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Cleanup
      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/oxy-server.pid ]; then
            kill $(cat /tmp/oxy-server.pid) || true
            echo "Backend server stopped"
          fi

      - name: Show server logs
        if: failure()
        run: |
          echo "=== Backend Server Logs ==="
          if [ -f oxy-server.log ]; then
            tail -n 200 oxy-server.log
          else
            echo "No server logs found at oxy-server.log"
          fi

          echo ""
          echo "=== Checking if server process is still running ==="
          if [ -f /tmp/oxy-server.pid ]; then
            ps -p $(cat /tmp/oxy-server.pid) || echo "Server process not running"
          fi

      # Send Slack notification on push failure to oxy main
      - name: Find Slack user
        if:
          failure() && steps.run-playwright.outcome == 'failure' && github.event_name
          == 'push' && github.repository == 'oxy-hq/oxygen'
        id: find-slack-user
        uses: scribd/find-slack-user-action@74b39f55855f7ccb59a0901b495e589c9b0f5031 # v1
        continue-on-error: true
        with:
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          email: ${{ github.event.head_commit.author.email }}

      - name: Prepare Slack notification message
        if:
          failure() && steps.run-playwright.outcome == 'failure' && github.event_name
          == 'push' && github.repository == 'oxy-hq/oxygen'
        id: prepare-slack
        run: |
          GITHUB_USER="${{ github.event.head_commit.author.username || github.actor }}"
          AUTHOR_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          SLACK_MEMBER_ID="${{ steps.find-slack-user.outputs.member-id }}"

          echo "GitHub user: $GITHUB_USER"
          echo "Slack member ID: ${SLACK_MEMBER_ID:-not found}"

          if [ -n "$SLACK_MEMBER_ID" ]; then
            echo "✓ Found Slack user for $GITHUB_USER"
            AUTHOR_TEXT="*Author:*\n<@${SLACK_MEMBER_ID}> (${AUTHOR_NAME})"
            MENTION_TEXT="<@${SLACK_MEMBER_ID}> - E2E tests failed on your commit"
          else
            echo "✗ No Slack user found for $GITHUB_USER"
            AUTHOR_TEXT="*Author:*\n${AUTHOR_NAME} (@${GITHUB_USER})"
            MENTION_TEXT=""
          fi

          # Export for next step
          echo "author_text<<EOF" >> $GITHUB_OUTPUT
          echo "$AUTHOR_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "mention_text<<EOF" >> $GITHUB_OUTPUT
          echo "$MENTION_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if:
          failure() && steps.run-playwright.outcome == 'failure' && github.event_name
          == 'push' && github.repository == 'oxy-hq/oxygen'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "eng-events-e2e",
              "text": "🚨 E2E Tests Failed on oxy Main Branch - ${{ steps.prepare-slack.outputs.mention_text || github.event.head_commit.author.name }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 E2E Tests Failed on oxy Main Branch"
                  }
                },
                ${{ steps.prepare-slack.outputs.mention_text && format('{{ "type": "section", "text": {{ "type": "mrkdwn", "text": "{0}" }} }},', steps.prepare-slack.outputs.mention_text) || '' }}
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\noxy-hq/oxygen"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\nmain"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ steps.prepare-slack.outputs.author_text }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Commit"
                      },
                      "url": "${{ github.event.head_commit.url }}"
                    }
                  ]
                }
              ]
            }

  # The matrix, services, boot logic, and healing PR comment live in
  # `.github/workflows/agentic-tests.yaml`. That file is also runnable
  # standalone via workflow_dispatch — see its `on:` block for the
  # required inputs.
  agentic-tests:
    name: Agentic browser tests
    needs: [changesets, cargo-check-and-test]
    if: |
      github.repository == 'oxy-hq/oxygen-internal' && (
        inputs.agentic_only == true ||
        needs.changesets.outputs.web-app == 'true' ||
        needs.changesets.outputs.oxy == 'true'
      ) && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        github.event_name == 'push'
      )
    uses: ./.github/workflows/agentic-tests.yaml
    secrets: inherit
