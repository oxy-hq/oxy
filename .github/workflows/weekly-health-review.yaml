# Weekly Health Review
#
# Replaces the former `weekly-autofix.yaml` (mechanical fixes → PR) and
# `claude-weekly-enhancements.yaml` (analysis matrix → issue). It fuses both
# and elevates them to the multi-dimension review this repo does by hand:
#
#   Job 1 `review`  — a 6-dimension parallel matrix of READ-ONLY analyzers
#                     (architecture / correctness / performance / security /
#                     devex / ai-llm), each emitting file:line-cited findings.
#   Job 2 `implement-and-pr` — synthesizes one prioritized P0→P4 report,
#                     auto-implements ONLY the high-confidence low-risk subset
#                     (compile-checked), applies the deterministic mechanical
#                     fixes the old autofix bot did, and opens ONE PR for human
#                     review. Never auto-merges.
#
# Safety rails learned from doing this by hand: scoped tool allowlists (no bare
# Bash + secrets), per-job timeouts + --max-turns caps, SHA-pinned actions,
# and an implementer that is told to stay on its branch and never touch main.

name: Weekly Health Review

on:
  schedule:
    # Mondays 06:00 UTC (13:00 Vietnam) — start-of-week report. Moved off the
    # old Sun-07:30 slot that autofix + enhancements both shared (a collision).
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least-privilege by default (review jobs are read-only); the implement job
# elevates its own permissions below.
permissions:
  contents: read
  id-token: write

concurrency:
  group: weekly-health-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review (${{ matrix.dimension }})
    if: github.repository == 'oxy-hq/oxygen-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dimension: architecture
            focus: >-
              crate/module boundaries and the agentic layering (imports must
              flow downward per internal-docs/backend-architecture.md),
              coupling, oversized files/functions (>400-line files, >60-line
              fns), duplication, dead code, leaky abstractions.
          - dimension: correctness
            focus: >-
              unwrap/expect/panic on runtime request or async paths, silently
              swallowed errors, blocking calls in async, locks held across
              .await, resource leaks, SeaORM migration data-loss /
              irreversibility, and the SSE terminal-event invariant.
          - dimension: performance
            focus: >-
              DB N+1 and missing indexes, connection-pool config, hot-path
              allocations/clones, blocking-in-async, caching, and frontend
              bundle size / code-splitting.
          - dimension: security
            focus: >-
              authn/authz and multi-tenant scoping (workspace_id/project_id
              filters), input validation & injection (SQL/SSRF), secret
              handling, the LLM/agent tool surface (prompt injection, tool
              sandboxing), dependency advisories, and GitHub Actions
              least-privilege / SHA-pinning.
          - dimension: devex
            focus: >-
              build/CI times & caching, whether lint/format/test/coverage gates
              are actually blocking, flaky tests, CI structure/complexity, and
              docs/onboarding gaps.
          - dimension: ai-llm
            focus: >-
              model-ID pinning and drift, prompt/context sizes and token
              budgets, LLM call retries/timeouts/streaming, eval coverage and
              whether evals gate CI, and runaway-loop / cost controls.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Analyze ${{ matrix.dimension }}
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          prompt: |
            You are the ${{ matrix.dimension }} reviewer in Oxy's automated
            weekly health review. Repository: oxy-hq/oxygen-internal (Rust
            workspace + React/TypeScript frontend). Read CLAUDE.md,
            product-context.md, and internal-docs/backend-architecture.md FIRST
            for the rules and known gotchas.

            Your dimension — ${{ matrix.dimension }}: ${{ matrix.focus }}

            Do a READ-ONLY review:
            1. `git log --oneline --since="7 days ago"` to see recent churn and
               weight recently-changed code more heavily.
            2. Also sweep the dimension broadly, not only recent changes.
            3. Surface the highest-leverage issues. Every finding MUST cite a
               real file:line you actually opened — never guess or invent. Skip
               anything you cannot verify.

            Write findings to `findings-${{ matrix.dimension }}.md` in the repo
            root — highest-leverage first, at most 6 — in EXACTLY this format:

            ## ${{ matrix.dimension }}
            **N. Short title** — effort S/M/L × impact low/med/high — `path/to/file:line`
            One or two sentences: why it matters, then the concrete fix.

            If nothing noteworthy: write `_No ${{ matrix.dimension }} findings this week._`

            Constraints: READ-ONLY (do NOT edit code); real citations only; be
            terse and evidence-dense; no filler.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git ls-files:*)"
            --max-turns 40
            --model claude-opus-4-8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: findings-${{ matrix.dimension }}
          path: findings-${{ matrix.dimension }}.md
          if-no-files-found: warn

  implement-and-pr:
    name: Synthesize, implement safe fixes & open PR
    needs: review
    if: github.repository == 'oxy-hq/oxygen-internal' && !cancelled()
    runs-on: ubuntu-latest
    # Bound the whole implement + compile-check + PR loop. Generous because a
    # cold cache pays for `cargo clippy --fix --workspace` on top of the agent.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get run date
        id: date
        run: echo "value=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      # Private cargo git deps live under github.com/oxy-hq/* (airway, airform,
      # airlayer, snowflake-rs). `git-fetch-with-cli` is on (.cargo/config.toml),
      # so cargo shells out to git, which uses gh as its credential helper.
      # --with-token stores the app token in gh's config so `cargo check`
      # resolves private deps. Must run before any cargo step.
      - name: Authenticate gh for private cargo git deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "$GH_APP_TOKEN" | gh auth login --with-token
          gh auth setup-git

      - name: Prep cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download dimension findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: findings/

      - name: Synthesize report & implement high-confidence fixes
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          prompt: |
            You are the implementer + synthesizer in Oxy's automated weekly
            health review, running UNATTENDED in CI on a fresh throwaway branch.
            Repository: oxy-hq/oxygen-internal. Read CLAUDE.md, product-context.md,
            and internal-docs/backend-architecture.md FIRST.

            The six dimension findings are under `findings/` (glob
            `findings/**/findings-*.md`). Do TWO things.

            A) SYNTHESIZE a prioritized report and WRITE it to
               `internal-docs/health-review/${{ steps.date.outputs.value }}.md`:
               - Merge and de-duplicate all findings into ONE list, ordered
                 P0 (correctness/security) → P1 (cost/perf) → P2 (quality gates)
                 → P3 (refactors/DRY) → P4 (bigger bets).
               - Each item: **title** — effort S/M/L × impact — `file:line` —
                 why it matters — the fix. Lead with a 5-bullet executive summary.
               - Add a "## Auto-implemented this run" section listing exactly what
                 you changed in step B, and a "## Left for human triage" section
                 for everything you did NOT implement.

            B) IMPLEMENT only the HIGH-CONFIDENCE, LOW-RISK subset. HARD RULES:
               - Only safe, mechanical, or clearly-correct SMALL fixes — e.g. add
                 a missing DB index migration, remove a stray debug log, batch an
                 obvious N+1, add a missing timeout/retry, fix a doc, tighten an
                 obvious validation, or the workspace-dependency consolidation the
                 old autofix bot did (move deps used in ≥3 crates into
                 [workspace.dependencies] as `{ workspace = true }`; never git
                 deps; never change versions; preserve `optional = true`).
               - NEVER attempt rearchitectures, crate splits, broad refactors,
                 public API/signature changes, or anything spanning many files.
               - Every change MUST keep the code compiling. After editing a crate,
                 run `cargo check -p <that_crate>` (NOT the whole workspace, NOT
                 --release, NOT nextest). Fix or fully REVERT anything that does
                 not compile. If unsure whether a fix is safe, DO NOT make it —
                 describe it in the report for humans instead.
               - Respect every rule in CLAUDE.md and backend-architecture.md.
               - Keep the TOTAL diff small and reviewable.

            CRITICAL branch hygiene: you are already on the correct branch. NEVER
            run `git checkout`, `git switch`, `git branch`, `git commit`,
            `git push`, `git reset`, or `git stash`, and never touch `main` — a
            later CI step commits your working-tree changes and opens the PR. Do
            not `cd` outside the repository. Just leave your edits uncommitted in
            the working tree and the report file written.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cargo check:*),Bash(cargo fmt:*),Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(cat:*)"
            --max-turns 80
            --model claude-opus-4-8

      # Deterministic mechanical cleanup carried over from the old autofix bot.
      # `continue-on-error` so a lint/format hiccup never blocks the report PR.
      - name: cargo clippy --fix
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --broken-code --workspace --lib
      - name: cargo fmt
        continue-on-error: true
        run: cargo fmt --all
      - name: pnpm format
        continue-on-error: true
        working-directory: web-app
        run: pnpm format

      - name: Drop downloaded findings (don't commit them)
        run: rm -rf findings/

      - name: Capture report for PR body
        id: report
        run: |
          f="internal-docs/health-review/${{ steps.date.outputs.value }}.md"
          if [ ! -f "$f" ]; then
            mkdir -p internal-docs/health-review
            echo "# Weekly Health Review — ${{ steps.date.outputs.value }}" > "$f"
            echo "" >> "$f"
            echo "_The synthesis step produced no report file; see the workflow run logs._" >> "$f"
          fi
          {
            echo 'body<<HEALTH_REVIEW_EOF'
            cat "$f"
            echo ''
            echo '---'
            echo '_Automated weekly health review. Report + any auto-implemented safe fixes above are for human review — this PR is never auto-merged. Deeper items are listed for triage._'
            echo 'HEALTH_REVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: health-review/weekly-${{ github.run_id }}
          commit-message: "chore(health-review): weekly review ${{ steps.date.outputs.value }}"
          title: "chore: weekly health review — ${{ steps.date.outputs.value }}"
          body: ${{ steps.report.outputs.body }}
          labels: "automated,health-review"
          delete-branch: true
