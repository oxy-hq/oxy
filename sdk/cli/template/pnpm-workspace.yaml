# Custom app bundles live under `apps/`. Both globs are carried from the
# customer-apps monorepo's working workspace file, and both earn their place:
#
#   apps/*      one app per directory — what a single-customer repo uses
#   apps/*/*    an org-nested layout — kept so a bundle lifted out of the
#               shared monorepo, where apps sit at apps/<org>/<app>/, works
#               here unchanged
#
# The URL an app is served at comes from its own oxy-app.json slug, not from
# its folder depth, so either layout is valid.
packages:
  - "apps/*"
  - "apps/*/*"

# Which dependencies may run their install/postinstall scripts. pnpm 11 runs
# none it has not been told about, and FAILS the install
# (`ERR_PNPM_IGNORED_BUILDS`) on any dependency with a build script this map
# does not decide. These three are what the real app bundles need: esbuild and
# unrs-resolver check for, or fetch, a platform binary, sharp builds one when
# no prebuilt fits. esbuild is in every app that has Oxy Functions — `oxyc
# publish` bundles them with `pnpm exec esbuild`. Add to the map rather than
# replacing it: a new dependency with a build script stops the install until
# somebody writes `true` (run it) or `false` (skip it) for it here.
#
# The key is `allowBuilds`. pnpm 11 removed `onlyBuiltDependencies`, the list
# this file used to carry, and ignores it without a word: with esbuild listed
# there, pnpm 11.22.0 still fails an app's install on `Ignored build scripts:
# esbuild@0.28.2`. pnpm 10.33 reads `allowBuilds` too, though it rarely gets
# the chance: package.json pins pnpm 11.22.0 (`packageManager`), and a pnpm 10
# switches itself to that version before installing anything.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm 11 lays `node_modules` out for a new store version, so its first install
# over a tree pnpm 10 wrote has to delete the tree and recreate it — and it
# asks first. With no terminal to ask on — an agent or a script running
# `pnpm install`, or `oxyc publish`, which runs one — it aborts instead, with
# `ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY`. Nothing is lost by not asking:
# the tree is rebuilt from the lockfile. CI never hits it — a runner starts
# with no `node_modules`.
confirmModulesPurge: false
