# Oxy topic template — copy, rename to <name>.topic.yml, and fill in.
# A topic is a question area: a base view plus the views it may join to.
# Name it after the questions people ask, not after a table; most topics
# span several views that share entity names.

name: my_topic_name
description: "Which questions this topic answers, and what it always excludes"
base_view: primary_view_name  # the view queries start from
views:
  - primary_view_name
  # - related_view_name  # joins resolve through matching entity names

# Optional: filters applied to every query in this topic, ANDed with the
# user's own. Write `field:` as view.dimension — a bare name is looked up in a
# view named like the TOPIC, not the base view, so it only works when the two
# share a name.
# default_filters:
#   - field: primary_view_name.is_voided
#     eq:
#       value: false
#
#   - field: primary_view_name.status
#     not_in:
#       values: ["cancelled", "test"]
#
#   - field: primary_view_name.amount
#     gte:
#       value: 0
#
#   - field: primary_view_name.created_date
#     in_date_range:
#       from: "2024-01-01"  # a date, or a relative expression
#       to: "now"

# Operators (the operator name is the key; its value sits under it):
# - eq / neq / gt / gte / lt / lte:      value: <scalar>
# - in / not_in:                         values: [<scalar>, ...]
# - in_date_range / not_in_date_range:   from: <date>, to: <date>
