# Oxy view template — copy, rename to <name>.view.yml, and fill in.
# One view = one table (or `sql:`) plus the vocabulary an agent may use on it.
# No `# yaml-language-server: $schema=` header: no schema is published for views.

name: my_view_name
description: "What a row is, when the data is complete, and what it excludes"
datasource: "database_name"  # a database name from config.yml
table: "schema_name.table_name"

entities:
  # Primary entity: the grain of one row (one per view).
  - name: primary_entity_name
    type: primary
    description: "What one row represents"
    key: primary_key_dimension  # a DIMENSION name below, never a raw column

  # Foreign entity: one per foreign-key column. Use the SAME name as the other
  # view's primary entity — matching names are what create the join.
  # - name: related_entity_name
  #   type: foreign
  #   description: "The related row in another view"
  #   key: foreign_key_dimension

dimensions:
  # Key dimensions (entity keys reference these by name)
  - name: primary_key_dimension
    type: string
    description: "Primary key"
    expr: primary_key_column

  # Regular dimensions (filterable / groupable)
  - name: dimension_name
    type: string  # string | number | date | datetime | boolean
    description: "Business-friendly description"
    expr: column_name_or_sql_expression
    samples: ["VALUE_A", "VALUE_B"]  # the FULL set of valid values for enum-like fields
    synonyms: ["alternative name", "abbreviation"]

  # Date dimensions: type date/datetime, and expr must yield a real date.
  # If the column is a string, integer or epoch, wrap it in a cast (sample one
  # row first) — otherwise date filters fail with TYPE_MISMATCH.
  - name: created_date
    type: date
    description: "Date the record was created"
    expr: created_at

  # Derived date parts, so the agent never writes date arithmetic
  - name: created_year
    type: number
    description: "Year the record was created"
    expr: "EXTRACT(YEAR FROM created_at)"
    synonyms: ["year"]

  # Boolean dimensions
  - name: is_active
    type: boolean
    description: "Whether the record is active"
    expr: "status = 'active'"
    samples: ["true", "false"]  # samples are ALWAYS strings, even for boolean/number dimensions

measures:
  - name: total_records
    type: count
    description: "Number of records"
    synonyms: ["record count"]

  - name: total_amount
    type: sum
    description: "Sum of amounts"
    expr: amount_column
    synonyms: ["total"]

  - name: average_amount
    type: average
    description: "Average amount per record"
    expr: amount_column

  # Filtered measure: "aggregate X where Y". Each filter expr is a SQL
  # condition over this view's columns, or a bare {{dimension}} naming a
  # dimension of THIS view. Prefer this over a custom CASE WHEN: it can be
  # answered from a pre-aggregation, a custom measure never can.
  - name: completed_amount
    type: sum
    description: "Sum of amounts for completed records only"
    expr: amount_column
    filters:
      - expr: "status = 'completed'"

  # Custom measure: only for what a filtered measure cannot express (ratios,
  # correlations, cross-period math). The expr is already an aggregate.
  # Never served from a pre-aggregation (nor are median or number measures).
  - name: completion_rate
    type: custom
    description: "Share of records that are completed"
    expr: "SUM(CASE WHEN status = 'completed' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)"

# Freshness — OPTIONAL but cheap. Every value is a one-element LIST of strings.
# Without freshness_watermark_column the agent uses the first date dimension.
# meta:
#   freshness_watermark_column: ["created_date"]
#   freshness_expected_cadence: ["hourly"]
#   freshness_complete_through: ["previous full hour (UTC)"]
#   freshness_caveat: ["The current hour is partial."]

# Pre-aggregations (rollups) — OPTIONAL and opt-in: with no block, the view has
# no rollups at all. Members are names declared above, never raw columns.
#
# refresh_key:                   # view-level default; exactly ONE of every / sql
#   every: "1h"
#
# pre_aggregations:
#   - name: by_month
#     dimensions: [dimension_name]
#     measures: [total_records, total_amount]  # count/count_distinct/sum/average/min/max
#     time_dimension: created_date             # a date/datetime dimension above
#     granularity: day   # second|minute|hour|day|week|month|quarter|year; serves this
#                        # grain or coarser — but a `week` rollup never serves month+
#     refresh_key:       # optional per-rollup override
#       sql: "SELECT MAX(updated_at) FROM schema_name.table_name"
