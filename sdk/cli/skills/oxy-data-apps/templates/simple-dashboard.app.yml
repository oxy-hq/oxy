# Simple dashboard — copy, rename to <your_app>.app.yml, and customize.
#
# The app's name is its filename; there is no `name:` key.
# Customize:
#   - `database:` must be a database name from your config.yml
#   - replace `orders`, `order_date`, `category` and `amount` with your table and columns
#   - the SQL below is Postgres / DuckDB / Snowflake dialect; for BigQuery use
#     DATE_TRUNC(order_date, MONTH), for ClickHouse toStartOfMonth(order_date)

title: Orders Overview
description: |
  Key order metrics, the monthly trend, and a breakdown by category.
published: false # flip to true to show the app in the sidebar

tasks:
  # One row of headline numbers
  - name: summary_metrics
    type: execute_sql
    database: warehouse
    sql_query: |
      SELECT
        COUNT(*)                 AS order_count,
        COUNT(DISTINCT category) AS category_count,
        ROUND(SUM(amount), 2)    AS total_amount,
        ROUND(AVG(amount), 2)    AS avg_amount
      FROM orders
      WHERE order_date >= '2024-01-01'

  # Trend over time
  - name: monthly_trend
    type: execute_sql
    database: warehouse
    sql_query: |
      SELECT
        DATE_TRUNC('month', order_date) AS month,
        COUNT(*)                        AS order_count,
        ROUND(SUM(amount), 2)           AS total_amount
      FROM orders
      WHERE order_date >= '2024-01-01'
      GROUP BY 1
      ORDER BY 1

  # Breakdown by category
  - name: by_category
    type: execute_sql
    database: warehouse
    sql_query: |
      SELECT
        category,
        COUNT(*)              AS order_count,
        ROUND(SUM(amount), 2) AS total_amount
      FROM orders
      WHERE order_date >= '2024-01-01'
      GROUP BY category
      ORDER BY total_amount DESC

display:
  - type: markdown
    content: |
      # Orders Overview

      Key metrics since January 2024.

  - type: table
    title: Summary
    data: summary_metrics
    formats:
      total_amount: currency
      avg_amount: currency
      order_count: number

  - type: line_chart
    title: Monthly total
    data: monthly_trend
    x: month
    y: total_amount
    x_axis_label: Month
    y_axis_label: Amount
    y_format: currency

  - type: row
    columns: 2
    children:
      - type: bar_chart
        title: By category
        data: by_category
        x: category
        y: total_amount
        y_format: currency

      - type: pie_chart
        title: Share by category
        data: by_category
        name: category
        value: total_amount
        value_format: currency

  - type: table
    title: Category details
    data: by_category
    formats:
      total_amount: currency
