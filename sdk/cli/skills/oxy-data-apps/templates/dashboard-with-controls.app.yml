# Dashboard with interactive controls — copy, rename to <your_app>.app.yml, customize.
#
# Shows all three control kinds, a data-driven dropdown (`source:`), a row
# layout, and control values injected into SQL.
#
# As written, every task reads a CSV through a local DuckDB database, so the
# browser can re-run the SQL itself when a control changes (client mode).
#   - `database: local` must be a DuckDB entry in your config.yml; `'sales.csv'`
#     is a file in that database's dataset directory.
#   - For a warehouse (Postgres, Snowflake, BigQuery, ClickHouse…), change
#     `database:` and the FROM clauses. Those tasks run on the server
#     automatically; adding `mode: server` makes that explicit.
#   - Only {{ controls.x }}, {{ controls.x | sqlquote }},
#     {{ controls.x | default('v') }} and {% if controls.x %}…{% endif %} run in the
#     browser. Anything richer still works, on the server.

title: Sales Explorer
description: |
  Sales filtered live by region, start date, and a holidays-only toggle.
  Every chart and table re-runs when a control changes.
published: false # flip to true to show the app in the sidebar

tasks:
  # Feeds the `region` dropdown: the first column becomes the option list.
  # The 'All' sentinel row lets a viewer clear the filter.
  - name: region_list
    type: execute_sql
    database: local
    sql_query: |
      SELECT region
      FROM (
        SELECT 'All' AS region, 0 AS sort_key
        UNION ALL
        SELECT DISTINCT region, 1 AS sort_key FROM 'sales.csv'
      ) AS options
      ORDER BY sort_key, region

  - name: revenue_by_category
    type: execute_sql
    database: local
    sql_query: |
      SELECT category, SUM(revenue) AS total_revenue
      FROM 'sales.csv'
      WHERE sale_date >= {{ controls.start_date | sqlquote }}
        AND ({{ controls.region | sqlquote }} = 'All'
             OR region = {{ controls.region | sqlquote }})
        {% if controls.holidays_only %}AND period = 'Holiday'{% endif %}
      GROUP BY category
      ORDER BY total_revenue DESC

  - name: revenue_by_region
    type: execute_sql
    database: local
    sql_query: |
      SELECT region, SUM(revenue) AS total_revenue
      FROM 'sales.csv'
      WHERE sale_date >= {{ controls.start_date | sqlquote }}
        AND ({{ controls.region | sqlquote }} = 'All'
             OR region = {{ controls.region | sqlquote }})
        {% if controls.holidays_only %}AND period = 'Holiday'{% endif %}
      GROUP BY region
      ORDER BY total_revenue DESC

  - name: sales_detail
    type: execute_sql
    database: local
    sql_query: |
      SELECT region, category, period, sale_date, revenue
      FROM 'sales.csv'
      WHERE sale_date >= {{ controls.start_date | sqlquote }}
        AND ({{ controls.region | sqlquote }} = 'All'
             OR region = {{ controls.region | sqlquote }})
        {% if controls.holidays_only %}AND period = 'Holiday'{% endif %}
      ORDER BY sale_date DESC
      LIMIT 500

display:
  # Controls bar: inline `- type: control` blocks at the top level of `display:`.
  # The kind is `control_type:`, NOT `type:`. Never put a control inside a `row`.
  - type: control
    name: region
    control_type: select
    label: Region
    source: region_list # data-driven dropdown (instead of static `options:`)
    default: All

  - type: control
    name: start_date
    control_type: date
    label: From date
    default: "2024-01-01"

  - type: control
    name: holidays_only
    control_type: toggle
    label: Holidays only
    default: false

  - type: markdown
    content: |
      # Sales Explorer

      Filter by **region**, **start date**, and **holiday periods** with the
      controls above. Charts and tables update automatically.

  # Two charts side by side
  - type: row
    columns: 2
    children:
      - type: bar_chart
        title: Revenue by category
        data: revenue_by_category
        x: category
        y: total_revenue
        y_format: currency

      - type: pie_chart
        title: Revenue by region
        data: revenue_by_region
        name: region
        value: total_revenue
        value_format: currency

  - type: table
    title: Filtered sales (latest 500)
    data: sales_detail
    formats:
      revenue: currency
