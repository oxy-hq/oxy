name: ''
description: ''
controls:
  - name: store
    type: select
    source: store_list
    default: '1'
tasks:
  - name: store_list
    type: execute_sql
    database: local
    sql_query: SELECT DISTINCT Store FROM oxymart ORDER BY Store
    variables: null
    export: null
    dry_run_limit: null
    cache: null
    mode: client
  - name: store_summary
    type: execute_sql
    database: local
    sql_query: |
      SELECT
        Store,
        MIN(Date)::VARCHAR AS first_week,
        MAX(Date)::VARCHAR AS last_week,
        SUM(Weekly_Sales) AS total_sales,
        AVG(Weekly_Sales) AS avg_weekly_sales,
        COUNT(*) AS weeks_observed
      FROM oxymart
      WHERE Store = {{ controls.store }}
      GROUP BY Store
    variables: null
    export: null
    dry_run_limit: null
    cache: null
    mode: client
  - name: recent_sales
    type: execute_sql
    database: local
    sql_query: |
      SELECT
        Date::VARCHAR AS Date,
        Weekly_Sales,
        Holiday_Flag
      FROM oxymart
      WHERE Store = {{ controls.store }}
      ORDER BY Date DESC
      LIMIT 12
    variables: null
    export: null
    dry_run_limit: null
    cache: null
    mode: client
display: []

published: true
