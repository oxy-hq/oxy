# Single-port reverse proxy in front of MediaMTX + the worker preview
# server, so Tailscale Funnel can publish *one* HTTPS endpoint and we
# don't need Oxy to dial the box's tailnet IP for HLS / snapshot /
# clips. Funnel publishes `http://edge-gateway:80`; this config splits
# requests by URL path to the right upstream:
#
#   /preview/* (snapshot, recording-segments)  → worker        :8090
#   /list      (MTX playback segment index)    → mediamtx-9996 :9996
#   /get       (MTX playback clip download)    → mediamtx-9996 :9996
#   /cam-X/whep*  (WebRTC signaling)           → mediamtx-8889 :8889
#   /cam-X/...    (HLS playlist + segments)    → mediamtx-8888 :8888
#
# The Basic Auth header on /list + /get (sent by Oxy as `oxy:any`,
# which MTX validates against its playback service config) passes
# through unchanged — nginx doesn't strip Authorization.
#
# Why nginx at all rather than multiple `tailscale serve` mount points:
# tailscale serve only supports pure path-prefix routing, so we
# couldn't distinguish `/cam-X/whep` (WebRTC, port 8889) from
# `/cam-X/index.m3u8` (HLS, port 8888) without restructuring the
# browser-facing URLs. nginx is one small container; URL stability
# is worth the trade.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Bump the per-stream upload limit to match MediaMTX's tolerated
    # SDP offer size. WHEP offers from modern browsers can be ~10KB.
    client_max_body_size 1m;

    # Buffering off for HLS segments + WHEP signaling — these are
    # latency-sensitive and the upstream already chunk-encodes.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for the WHEP `keepaliveCheck` long-poll style
    # connections MediaMTX may use; HLS segment GETs finish in ms,
    # so this doesn't hurt them.
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    server {
        listen 80 default_server;

        # === MediaMTX playback service (recordings index + download) ====
        # Both /list and /get are flat paths (no leading /cam-*); they
        # take ?path= as a query param so nginx can route them as exact
        # location matches.
        location = /list { proxy_pass http://mediamtx:9996; }
        location = /get  { proxy_pass http://mediamtx:9996; }

        # === Worker aiohttp preview server (snapshot + recording UI) ===
        # The /preview/ prefix matches what `service::preview::snapshot`
        # already constructs (`/preview/cameras/{id}/snapshot.jpg`),
        # so the migration is a base-URL swap with no path rewrite.
        location /preview/ { proxy_pass http://edge:8090; }

        # === MediaMTX WebRTC signaling (WHEP) =========================
        # Regex location, evaluated before the /cam-X/ HLS prefix
        # because nginx tries regexes in declaration order.
        # Pattern: `/cam-{hex}/whep` or `/cam-{hex}/whep/anything`.
        location ~ ^/cam-[a-f0-9]+/whep(/.*)?$ {
            proxy_pass http://mediamtx:8889;
        }

        # === MediaMTX HLS (playlist + segments) =======================
        # Everything else under `/cam-X/` is HLS — `.m3u8` playlists,
        # `.ts` segments, `.m4s` fragments, `init.mp4` for LL-HLS.
        location ~ ^/cam-[a-f0-9]+/ {
            proxy_pass http://mediamtx:8888;
        }

        # Health check for compose / external monitors. Cheap, no
        # upstream dial.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
