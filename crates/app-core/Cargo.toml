[package]
name = "oxy-app-core"
version.workspace = true
authors.workspace = true
description = "Shared seam for the oxy-app HTTP layer: audit trail, serve-mode detection, org and custom-app subdomain dispatch, and member-role authorization"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
oxy = { workspace = true }
oxy-auth = { workspace = true }
oxy-compile = { workspace = true }
oxy-git = { workspace = true }
oxy-shared = { workspace = true }
entity = { workspace = true }

# AppState field types (lifted here so the router + surface crates can hold it):
oxy-observability = { workspace = true }
agentic-semantic = { workspace = true }
agentic-http = { workspace = true }
oxy-airlayer-compat = { workspace = true }

# `function_seam`: the custom-app function seam traits name these. Both are
# already in this crate's graph through `oxy`.
agentic-connector = { workspace = true }
agentic-pipeline = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
lru = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
