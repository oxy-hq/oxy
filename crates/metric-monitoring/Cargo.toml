[package]
name = "oxy-metric-monitoring"
description = "Time-series anomaly detection over the semantic-layer metric tree"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
agentic-analytics = { workspace = true }
airlayer = { workspace = true }
async-trait = { workspace = true }
augurs-core = { workspace = true }
augurs-ets = { workspace = true, features = ["mstl"] }
augurs-mstl = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
entity = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }
