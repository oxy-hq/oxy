[package]
name = "oxy-api-github"
version.workspace = true
authors.workspace = true
description = "GitHub OAuth + git-namespace HTTP surface — a sibling crate mounted by oxy-server, so editing it no longer recompiles oxy-app"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The route mount re-applies the org-scoped inner middleware (org_middleware +
# subscription_guard) that live in oxy-app; auth is inherited from the seam's
# apply_middleware, not re-applied here. This is the only oxy-app dependency, and
# oxy-app never depends back on this crate (the whole point of the extraction).
oxy-app = { path = "../app" }
oxy-app-core = { workspace = true }     # AppState (the router state type)
oxy-server-authz = { workspace = true } # enforce_for, Action, Resource, OrgContextExtractor
oxy = { workspace = true }              # database client, github core (git client / app auth)
oxy-auth = { workspace = true }         # AuthenticatedUserExtractor
entity = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
constant_time_eq = { workspace = true }
urlencoding = { workspace = true }
