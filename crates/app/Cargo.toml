[package]
name = "oxy-app"
version.workspace = true
authors.workspace = true
description = "Oxy Application - CLI and HTTP server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxy"
path = "src/main.rs"

[features]
default = ["customer-app-functions"]
# V8-isolate runtime for Oxy Functions. On by default so `oxy serve --local`
# runs the real runtime (see design doc §11.8); a build profile that wants to
# skip V8 entirely can use `--no-default-features`.
customer-app-functions = ["deno_core", "deno_error"]

[dependencies]
# In-process authorization policy engine for the partner tier (ADR
# 2026-07-13). Embedded Rust crate — no external service.
cedar-policy = "4"
deno_core = { workspace = true, optional = true }
deno_error = { workspace = true, optional = true }
handlebars = { workspace = true }
df-interchange = { workspace = true, features = ["arrow_56", "arrow_57"] }
libc = { workspace = true }

# Core functionality
oxy = { workspace = true }
oxy-git = { workspace = true }
oxy-llm = { workspace = true }
oxy-observability = { workspace = true, features = [
    "duckdb",
    "postgres",
    "clickhouse",
    "airhouse",
] }
oxy-shared = { workspace = true }
oxy-workspace-fs = { workspace = true }
oxy-airform = { workspace = true }
agentic-analytics = { workspace = true }
agentic-builder = { workspace = true }
agentic-connector = { workspace = true, features = [
    "duckdb",
    "postgres",
    "clickhouse",
    "snowflake",
    "bigquery",
    "mysql",
    "domo",
] }
airhouse = { workspace = true, features = ["connector", "rest"] }
agentic-core = { workspace = true }
agentic-http = { workspace = true }
agentic-llm = { workspace = true }
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
agentic-semantic = { workspace = true }
agentic-automation = { workspace = true }
airlayer = { workspace = true }
oxy-airlayer-compat = { workspace = true }
oxy-auth = { workspace = true }
oxy-billing = { workspace = true }
oxy-cameras = { workspace = true }
oxy-compile = { workspace = true }
oxy-project = { workspace = true }
oxy-thread = { workspace = true }
oxy-semantic = { workspace = true }
oxy-metric-monitoring = { workspace = true }
entity = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
dashmap = { workspace = true }
async-openai = { workspace = true, features = [
    "byot",
    "chat-completion-types",
    "response-types",
    "_api",
    "responses",
    "chat-completion",
    "embedding-types",
    "embedding",
] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Validation
garde = { workspace = true, features = ["full"] }
schemars = { workspace = true, features = ["derive", "impl_json_schema"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging/Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
] }
log = { workspace = true }

# Web framework
axum = { workspace = true, features = ["multipart"] }
axum-server = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "compression-br", "compression-gzip"] }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }

# HTTP client. `stream` enables reqwest::Body::wrap_stream for the ide_proxy
# reverse-proxy (forwards IdeOnly request bodies without buffering).
reqwest = { workspace = true, features = ["stream"] }

# Code utilities
enum_dispatch = { workspace = true }
rapidfuzz = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive", "env"] }
colored = { workspace = true }
indicatif = { workspace = true }
headless_chrome = { workspace = true }

# Database
sea-orm = { workspace = true }
clickhouse = { workspace = true, features = ["rustls-tls"] }

# Machine learning (for traces analytics)
linfa = { workspace = true }
linfa-reduction = { workspace = true }
ndarray = { workspace = true, features = ["rayon"] }

# Data processing
arrow = { workspace = true, features = ["json"] }
parquet = { workspace = true }
duckdb = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tempfile = { workspace = true }
minijinja = { workspace = true, features = ["loader"] }
once_cell = { workspace = true }
scopeguard = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
include_dir = { workspace = true }
tower-serve-static = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }
constant_time_eq = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-s3 = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
# customer-apps publish pipeline: tarball pack/unpack + bundle LRU cache
tar = { workspace = true }
flate2 = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
governor = { workspace = true }
base64 = { workspace = true, features = ["std"] }
regex = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
glob = { workspace = true }
home = { workspace = true }
human-panic = { workspace = true }
humantime = { workspace = true }
indoc = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
lazy_static = { workspace = true }
email_address = { workspace = true }
serde_urlencoded = { workspace = true }
self_update = { workspace = true }
slugify = { workspace = true }
syntect = { workspace = true }
tabled = { workspace = true }
terminal-light = { workspace = true }
terminal_size = { workspace = true }
secrecy = { workspace = true }
serde_with = { workspace = true }
strip-ansi-escapes = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
semver = { workspace = true }
backoff = { workspace = true, features = ["tokio"] }
rustc_version_runtime = { workspace = true }
sentry = { workspace = true }
omni = { workspace = true }
oxy-looker = { workspace = true }

# Database migration
migration = { workspace = true }

# MCP
rmcp = { workspace = true, features = [
    "server",
    "transport-sse-server",
    "transport-io",
] }

# Other dependencies from core that might be needed
dotenv = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
serial_test = { workspace = true }
oxy-test-utils = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
wiremock = { workspace = true }
testcontainers = { version = "0.27", features = [
    "blocking",
    "reusable-containers",
] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
