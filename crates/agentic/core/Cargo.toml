[package]
name = "agentic-core"
description = "Generic agentic workflow orchestration framework"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
storage = []

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Needed by `subrun::parse_oxy_comment_block` — main's cleanup PR
# removed this when our subrun module didn't exist there yet.
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "net", "io-util"] }
tempfile = { workspace = true }
