# Available operators:
# - eq: equals (value: "x")
# - neq: not equals (value: "x")
# - gt: greater than (value: 100)
# - gte: greater than or equal (value: 100)
# - lt: less than (value: 1000)
# - lte: less than or equal (value: 1000)
# - in: in array (values: ["a", "b", "c"])
# - not_in: not in array (values: ["x", "y"])
# - in_date_range: within date range (from: "date", to: "date")
# - not_in_date_range: outside date range (from: "date", to: "date")
