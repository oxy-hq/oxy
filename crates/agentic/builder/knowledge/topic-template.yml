# Oxy Topic Template
# Topics organize views by business domain
# Best practice: Create one topic per view

name: my_topic_name
description: "Business domain description - what questions can this topic answer?"
base_view: primary_view_name  # The main view for this topic
views:
  - view_name_1
  # - view_name_2  # Add more views if they're related

