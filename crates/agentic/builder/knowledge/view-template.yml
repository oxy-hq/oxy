# Oxy View Template
# Copy this template and fill in the details for your data model

name: my_view_name
description: "Brief business-friendly description of what this view represents"
datasource: "database_name"  # Must match name in config.yml
table: "schema_name.table_name"

entities:
  # Primary entity - the main subject of this view (required)
  - name: primary_entity_name
    type: primary
    description: "What this entity represents"
    key: primary_key_dimension_name  # Must reference a dimension name below

  # Foreign entities - references to other views (optional)
  # - name: related_entity_name
  #   type: foreign
  #   description: "Related entity from another view"
  #   key: foreign_key_dimension_name

dimensions:
  # Key dimensions (for entity relationships)
  - name: primary_key_dimension
    type: string
    description: "Primary key description"
    expr: primary_key_column

  # Regular dimensions (filterable/groupable attributes)
  - name: dimension_name
    type: string  # string|number|date|datetime|boolean
    description: "Business-friendly description"
    expr: column_name_or_sql_expression
    samples: ["example1", "example2"]  # Optional, helps with understanding
    synonyms: ["alternative name", "abbreviation"]  # Optional, for natural language

  # Date dimensions
  - name: created_date
    type: date
    description: "Date record was created"
    expr: created_at

  # Calculated dimensions
  - name: year
    type: number
    description: "Year extracted from date"
    expr: "EXTRACT(YEAR FROM created_at)"
    synonyms: ["year"]

  # Boolean dimensions
  - name: is_active
    type: boolean
    description: "Whether record is active"
    expr: status = 'active'
    samples: ["true", "false"]   # samples are ALWAYS strings, even for boolean/number dimensions

measures:
  # Count measures
  - name: total_records
    type: count
    description: "Total number of records"
    synonyms: ["record count", "total"]

  # Sum measures
  - name: total_amount
    type: sum
    description: "Sum of all amounts"
    expr: amount_column
    synonyms: ["total", "sum"]

  # Average measures
  - name: average_amount
    type: average
    description: "Average amount per record"
    expr: amount_column
    synonyms: ["avg amount", "mean"]

  # Filtered measures — "aggregate X where Y" (conditional aggregation).
  # The filter `expr` is a raw SQL condition over the table's columns, exactly
  # like a WHERE clause. NEVER wrap a column in {{ }}: a {{col}} placeholder is
  # not substituted — it leaks into the compiled SQL and fails with
  # `syntax error at or near "{"`. Prefer this over a custom CASE WHEN.
  - name: filtered_total
    type: sum
    description: "Sum of amounts for a subset of rows"
    expr: amount_column
    filters:
      - expr: "status = 'completed'"

  # Custom measures — only for metrics a filtered measure can't express
  # (ratios, correlations, cross-period math). Write bare column names; no {{ }}.
  # NOT re-aggregatable by pre-aggregations (a query touching one always hits
  # the warehouse), so don't use custom for plain conditional aggregation.
  - name: custom_calculation
    type: custom
    description: "Custom SQL calculation"
    expr: |
      CASE
        WHEN condition THEN calculation
        ELSE other_calculation
      END

# Pre-aggregations (rollups) — OPTIONAL. Materialized partial aggregates that
# the engine serves from local Parquet instead of scanning the warehouse.
# Add for views backing dashboards / frequent KPI queries. Requires a
# top-level `pre_aggregations:` block in config.yml for the refresh worker.
#
# refresh_key:                 # view-level default for all rollups below
#   every: "1h"                # exactly one of `every` or `sql`
#
# pre_aggregations:
#   - name: rollup_name
#     dimensions:              # names defined above, never raw columns
#       - dimension_name
#     measures:                # count/count_distinct/sum/average/min/max only;
#       - total_amount         # custom/median/number measures cannot roll up
#     time_dimension: created_date  # a date/datetime dimension name
#     granularity: month       # second|minute|hour|day|week|month|quarter|year
#     refresh_key:             # OPTIONAL per-rollup override of the view-level key
#       sql: "SELECT MAX(updated_at) FROM schema_name.table_name"
