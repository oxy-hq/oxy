# yaml-language-server: $schema=https://raw.githubusercontent.com/oxy-hq/oxygen/refs/heads/main/json-schemas/workflow.json
#
# SQL-generation via an *analytics* `.agentic.yml` agent.
#
# Mirrors the `sql-gen-cache-demo.procedure.yml` shape but routes
# through the analytics FSM (semantic-layer aware, verified-query
# aware) instead of the builder agent.
#
# What's different from the builder demo:
#
#   - `agent_ref` points at a real `.agentic.yml` file. The agent's
#     `context:` block decides which semantic views, topics and
#     verified `.sql` files are in scope.
#   - `output: { mode: sql }` swaps the terminal contract: the FSM
#     terminates after producing SQL (skipping the natural-language
#     interpretation stage) so the SQL text becomes the run's answer.
#   - Pre-validated SQL writers — semantic-layer compile + verified
#     `.sql` matches — skip the executing stage entirely. LLM-generated
#     SQL gets a `LIMIT 0` smoke check before terminating.
#
# To validate manually:
#
#   - First run: agent generates SQL, file is created at
#     `results/cache/analytics_monthly_sales.sql`. The cached SQL runs
#     and the formatter prints the results.
#   - Open the cached file and edit (e.g. add a WHERE filter). Save.
#   - Second run: cache_hit fires on the `query` step (no analytics
#     pipeline call), the edited SQL runs, edits round-trip.

name: analytics_sql_gen_demo
description: |
  Generate a SQL query with the analytics agent (semantic-layer aware),
  cache it to disk, then execute it. Re-running picks up any manual
  edits to the cached SQL file.

tasks:
  # STEP 1: analytics agent in SQL-gen mode.
  #
  # `output: { mode: sql }` is the new switch — see
  # `crates/agentic/workflow/src/config.rs` for the schema. When set,
  # the analytics FSM terminates after SQL is produced (no
  # interpretation, no row materialisation for pre-validated paths).
  # `cache.path` persists the terminal SQL to disk; the file becomes
  # the source of truth for re-runs.
  - name: query
    type: agent
    agent_ref: analytics.agentic.yml
    prompt: |
      Aggregate total weekly sales by month for the oxymart dataset.

      Required output columns:
        - month (formatted like 2010-02)
        - total_sales (rounded to 2 decimal places)
        - num_weeks (the number of weekly rows that contributed)

      Order by month ascending. Limit to the first 24 months.
    output:
      mode: sql
    cache:
      enabled: true
      path: results/cache/analytics_monthly_sales.sql

  # STEP 2: run the cached SQL. `sql_file:` reads whatever's at the
  # path — agent output on first run, user edits on subsequent runs.
  - name: run_query
    type: execute_sql
    database: local
    sql_file: results/cache/analytics_monthly_sales.sql

  # STEP 3: pretty-print the result.
  - name: report
    type: formatter
    template: |
      ## Monthly sales (analytics-generated SQL)

      SQL source: `results/cache/analytics_monthly_sales.sql`
      SQL query:
      ```sql
      {{ query.text }}
      ```

      | Month | Total sales | Weeks |
      |-------|-------------|-------|{% for i in range(run_query|length) %}
      | {{ run_query.oxymart__week_date__month[i] }} | {{ run_query.oxymart__total_sales[i] }} | {{ run_query.oxymart__total_weeks[i] }} |{% endfor %}

      _Edit the cached SQL file and re-run — the analytics agent
      step skips on cache hit and your edits flow through unchanged._
