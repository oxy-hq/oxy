destination:
  # A database defined in config.yml. Must be an airway-writable type
  # (postgres or airhouse); `local-acme` is airhouse_managed, so credentials
  # are resolved at run time (an ephemeral per-user credential is minted).
  database: local-acme
  dataset_name: clickhouse_ingest
  schema_separator: "___"

# Optional: restrict to a subset of the source's resources.
# resources: []

# In-flight extractions when running resources in parallel (1-16).
concurrency: 1

# Streaming (concurrent extract->sink, live per-table progress) is on
# by default for streaming-capable destinations. Uncomment to force
# the bulk path.
# streaming: false
